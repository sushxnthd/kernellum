[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kernellum-k0"
version = "0.1.0"
description = "Kernellum K0: reproducible workload-aware accelerator design-space exploration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7"]

[project.scripts]
kernellum = "kernellum.cli:main"

[tool.setuptools.packages.find]
include = ["kernellum*"]
