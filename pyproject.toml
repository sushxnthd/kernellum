[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kernellum-research"
version = "0.2.0"
description = "Kernellum: workload-specific accelerator search with physical-design feedback"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7"]

[project.scripts]
kernellum = "kernellum.cli:main"

[tool.setuptools.packages.find]
include = ["kernellum*"]
