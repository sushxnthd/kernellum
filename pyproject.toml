[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kernellum-compiler"
version = "0.1.0"
description = "Research prototype for constraint-driven generation of quantized neural-network accelerators"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["kernellum"]

[tool.pytest.ini_options]
pythonpath = ["."]
