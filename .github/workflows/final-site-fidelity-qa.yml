name: Final site fidelity QA

on:
  push:
    paths:
      - '.github/workflows/final-site-fidelity-qa.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Run fidelity audit
        shell: bash
        run: |
          mkdir -p /tmp/site/kernellum
          cp -a docs/. /tmp/site/kernellum/
          python3 -m http.server 4173 -d /tmp/site >/tmp/kernellum-http.log 2>&1 &
          cat > qa.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const expectedPlans={
            'what-we-do/':['grid','rings-horizontal','image','rings-vertical','grid'],
            'who-we-are/':['image','rings-vertical','grid','rings-horizontal'],
            'careers/':['rings-horizontal','image','rings-vertical','grid','none'],
            'contact/':['rings-vertical','image','grid']
          };
          let failed=false;
          const errors=[];
          const context=await browser.newContext({viewport:{width:1440,height:1000},reducedMotion:'no-preference'});
          for(const path of ['','what-we-do/','who-we-are/','careers/','contact/']){
            const page=await context.newPage();
            const e=[];
            page.on('pageerror',x=>e.push('pageerror:'+x.message));
            page.on('console',m=>{if(m.type()==='error')e.push('console:'+m.text())});
            page.on('requestfailed',r=>e.push('requestfailed:'+r.url()+' '+(r.failure()?.errorText||'')));
            await page.goto('http://127.0.0.1:4173/kernellum/'+path,{waitUntil:'networkidle',timeout:60000});
            await page.waitForTimeout(1300);

            const basic=await page.evaluate(()=>{
              const h=document.querySelector('h1'),p=document.querySelector('p');
              return {
                h1Font:h?getComputedStyle(h).fontFamily:'',
                bodyFont:p?getComputedStyle(p).fontFamily:getComputedStyle(document.body).fontFamily,
                displayLoaded:document.fonts.check('500 16px "Space Grotesk"'),
                bodyLoaded:document.fonts.check('400 16px "IBM Plex Sans"'),
                canvas:!!document.querySelector('canvas')
              };
            });
            if(!basic.displayLoaded||!basic.bodyLoaded||!basic.canvas)e.push('basic rendering/font failure '+JSON.stringify(basic));

            const footerSelector=path?' .k-footer-primary':'footer#footer nav.primary';
            const blur=await page.locator(footerSelector.trim()).first().evaluate(el=>({
              backdrop:getComputedStyle(el).backdropFilter,
              webkit:getComputedStyle(el).webkitBackdropFilter,
              background:getComputedStyle(el).backgroundColor
            })).catch(()=>null);
            console.log('FOOTER_GLASS',path||'home',JSON.stringify(blur));
            if(!blur||!(blur.backdrop||blur.webkit||'').includes('blur(16px)'))e.push('footer blur mismatch '+JSON.stringify(blur));

            if(path){
              const plan=await page.locator('[data-particles]').evaluateAll(els=>els.map(e=>e.getAttribute('data-particles')));
              console.log('PARTICLES',path,JSON.stringify(plan));
              if(JSON.stringify(plan)!==JSON.stringify(expectedPlans[path]))e.push('particle plan mismatch '+JSON.stringify(plan));

              const statement=page.locator('.large-statement').first();
              if(await statement.count()){
                const lineCount=await statement.locator('.boon-line').count();
                if(lineCount<1)e.push('statement did not split into rendered lines');
                await statement.evaluate(el=>{
                  const vh=innerHeight,docBottom=el.getBoundingClientRect().bottom+scrollY;
                  scrollTo(0,docBottom-vh*.75);
                });
                await page.waitForTimeout(300);
                const sync=await statement.evaluate(el=>{
                  const r=el.getBoundingClientRect(),p=Math.max(0,Math.min(1,(innerHeight-r.bottom)/(innerHeight*.5)));
                  const expected=100*(1-p);
                  const lines=[...el.querySelectorAll('.boon-line')];
                  const actual=lines.map(x=>parseFloat((x.style.transform.match(/translateY\(([-\d.]+)%\)/)||[])[1]));
                  return {p,expected,actual,bottom:r.bottom};
                });
                console.log('STATEMENT_SYNC',path,JSON.stringify(sync));
                if(sync.actual.some(v=>!Number.isFinite(v)||Math.abs(v-sync.expected)>5))e.push('statement scroll mismatch '+JSON.stringify(sync));
              }
            }else{
              const sock=page.locator('section.sock').first();
              if(!(await sock.count())) e.push('homepage sock section missing');
              else{
                const lineCount=await sock.locator('h2 .k-line>span').count();
                console.log('SOCK_LINES',lineCount);
                if(lineCount<2)e.push('homepage sock heading not split into rendered lines');
                await sock.evaluate(el=>{
                  const vh=innerHeight,docBottom=el.getBoundingClientRect().bottom+scrollY;
                  scrollTo(0,docBottom-vh*.45);
                });
                await page.waitForTimeout(300);
                const sync=await sock.evaluate(el=>{
                  const r=el.getBoundingClientRect(),p=Math.max(0,Math.min(1,(innerHeight-r.bottom)/innerHeight));
                  const lp=Math.max(0,Math.min(1,(p-.4)/.6)),expected=100*(1-lp);
                  const lines=[...el.querySelectorAll('h2 .k-line>span')];
                  const actual=lines.map(x=>parseFloat((x.style.transform.match(/translateY\(([-\d.]+)%\)/)||[])[1]));
                  return {p,lp,expected,actual,bottom:r.bottom,text:el.querySelector('h2')?.innerText};
                });
                console.log('SOCK_SYNC',JSON.stringify(sync));
                if(sync.actual.some(v=>!Number.isFinite(v)||Math.abs(v-sync.expected)>5))e.push('homepage sock scroll mismatch '+JSON.stringify(sync));
              }
            }

            const filtered=e.filter(x=>!x.includes('favicon.ico'));
            if(filtered.length){failed=true;errors.push({path:path||'home',errors:filtered})}
            await page.close();
          }

          const mobile=await browser.newContext({viewport:{width:390,height:844},reducedMotion:'no-preference'});
          for(const path of ['','what-we-do/','who-we-are/','careers/','contact/']){
            const page=await mobile.newPage();const e=[];
            page.on('pageerror',x=>e.push('pageerror:'+x.message));
            page.on('console',m=>{if(m.type()==='error')e.push('console:'+m.text())});
            await page.goto('http://127.0.0.1:4173/kernellum/'+path,{waitUntil:'networkidle',timeout:60000});
            await page.waitForTimeout(900);
            const ok=await page.evaluate(()=>document.fonts.check('500 16px "Space Grotesk"')&&document.fonts.check('400 16px "IBM Plex Sans"')&&!!document.querySelector('canvas'));
            if(!ok)e.push('mobile font/canvas failure');
            if(e.length){failed=true;errors.push({path:'mobile '+(path||'home'),errors:e})}
            await page.close();
          }
          await mobile.close();await context.close();await browser.close();
          console.log('FINAL_ERRORS',JSON.stringify(errors));
          if(failed)process.exit(1);
          NODE
          node qa.mjs
