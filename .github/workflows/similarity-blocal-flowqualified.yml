name: SIMILARITY prospective flow-qualified B-local replication

env:
  ORFS_IMAGE: openroad/orfs@sha256:573c1716efa0e286c4f641c26d343e20929d58d27fffbb22be2d0b93f09764f6

on:
  pull_request:
    paths:
      - 'asic/blocal_flowqualified/**'
      - 'docs/SIMILARITY_BLOCAL_FLOWQUALIFIED_PREREGISTRATION.md'
      - 'scripts/similarity_blocal_flowqualified_*.py'
      - 'scripts/similarity_antenna_margin_canary.py'
      - 'scripts/similarity_asic_transfer_route.py'
      - 'rtl/kernellum_blocal_mac_array.sv'
      - 'rtl/similarity_asic_transfer_blocal.sv'
      - 'rtl/tb_kernellum_blocal_equivalence.sv'
      - 'tests/test_similarity_blocal_flowqualified.py'
      - '.github/workflows/similarity-blocal-flowqualified.yml'
  push:
    branches: [main]
    paths:
      - 'asic/blocal_flowqualified/**'
      - 'docs/SIMILARITY_BLOCAL_FLOWQUALIFIED_PREREGISTRATION.md'
      - 'scripts/similarity_blocal_flowqualified_*.py'
      - 'scripts/similarity_antenna_margin_canary.py'
      - 'scripts/similarity_asic_transfer_route.py'
      - 'rtl/kernellum_blocal_mac_array.sv'
      - 'rtl/similarity_asic_transfer_blocal.sv'
      - 'rtl/tb_kernellum_blocal_equivalence.sv'
      - 'tests/test_similarity_blocal_flowqualified.py'
      - '.github/workflows/similarity-blocal-flowqualified.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Verify frozen source, flow and protocol
        run: |
          python -m pip install pytest
          PYTHONPATH=. python -m pytest -q tests/test_similarity_blocal_flowqualified.py
          python -m py_compile \
            scripts/similarity_blocal_flowqualified_route.py \
            scripts/similarity_blocal_flowqualified_validate.py
          grep -q 'Status: \*\*draft until merged to main; no eligible physical route may precede that merge\*\*' \
            docs/SIMILARITY_BLOCAL_FLOWQUALIFIED_PREREGISTRATION.md
          echo '7cdd3223ac401ec9c9df5a792cb41f2e754262dbd2c6fad103752fce7afdc766  rtl/kernellum_blocal_mac_array.sv' | sha256sum -c -
          echo '1f6bd084dab5e368f34dee5c44fb6ca12a68860b4b26fff2f78b85277d50552a  rtl/similarity_asic_transfer_blocal.sv' | sha256sum -c -
          for family in blocal controls; do
            for platform in nangate45 sky130hd; do
              grep -qx 'export CAP_MARGIN = 31' "asic/blocal_flowqualified/${family}_config_${platform}.mk"
              grep -qx 'export SLEW_MARGIN = 25' "asic/blocal_flowqualified/${family}_config_${platform}.mk"
            done
          done
          grep -q 'RATIO_MARGIN = 20' scripts/similarity_blocal_flowqualified_route.py
          grep -q 'STAGE_TIMEOUT_SECONDS = 7200' scripts/similarity_blocal_flowqualified_route.py
          grep -q 'SEEDS = (397, 421, 449)' scripts/similarity_blocal_flowqualified_route.py
      - name: Compare signed GEMM on all four unopened shapes
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          mkdir -p results/similarity_blocal_flowqualified_preflight
          for geometry in '6 11' '11 6' '8 9' '9 8'; do
            set -- $geometry
            iverilog -g2012 -Wall -DTEST_ROWS=$1 -DTEST_COLS=$2 \
              -s tb_kernellum_blocal_equivalence \
              -o "results/similarity_blocal_flowqualified_preflight/tb_${1}x${2}.vvp" \
              rtl/kernellum_local_mac_array.sv \
              rtl/kernellum_blocal_mac_array.sv \
              rtl/tb_kernellum_blocal_equivalence.sv
            vvp "results/similarity_blocal_flowqualified_preflight/tb_${1}x${2}.vvp" | \
              tee "results/similarity_blocal_flowqualified_preflight/tb_${1}x${2}.log"
            grep -q "KERNELLUM_BLOCAL_EQUIVALENCE_PASS rows=$1 cols=$2" \
              "results/similarity_blocal_flowqualified_preflight/tb_${1}x${2}.log"
          done
          touch results/similarity_blocal_flowqualified_preflight/similarity_blocal_flowqualified_functional_passed
          git rev-parse HEAD > results/similarity_blocal_flowqualified_preflight/source_sha.txt
          sha256sum \
            docs/SIMILARITY_BLOCAL_FLOWQUALIFIED_PREREGISTRATION.md \
            scripts/similarity_blocal_flowqualified_route.py \
            scripts/similarity_blocal_flowqualified_validate.py \
            scripts/similarity_antenna_margin_canary.py \
            scripts/similarity_asic_transfer_route.py \
            rtl/kernellum_blocal_mac_array.sv \
            rtl/similarity_asic_transfer_blocal.sv \
            asic/blocal_flowqualified/*.mk \
            > results/similarity_blocal_flowqualified_preflight/source_hashes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: similarity-blocal-flowqualified-functional
          path: results/similarity_blocal_flowqualified_preflight/*
          retention-days: 90

  route:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Freeze flow-qualified prospective B-local replication')
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        platform: [nangate45, sky130hd]
        topology: [broadcast, local, blocal]
        seed: [397, 421, 449]
        geometry:
          - {split: discovery, rows: 6, cols: 11}
          - {split: discovery, rows: 11, cols: 6}
          - {split: holdout, rows: 8, cols: 9}
          - {split: holdout, rows: 9, cols: 8}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Prepare pinned OpenROAD flow
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static
          docker pull "$ORFS_IMAGE"
          mkdir -p "$RUNNER_TEMP/orfs"
          cid="$(docker create "$ORFS_IMAGE")"
          docker cp "$cid:/OpenROAD-flow-scripts/flow" "$RUNNER_TEMP/orfs/"
          docker rm "$cid"
          test -f "$RUNNER_TEMP/orfs/flow/scripts/final_outputs.tcl"
          test -f "$RUNNER_TEMP/orfs/flow/scripts/global_route.tcl"
      - name: Apply frozen repairs and route one unopened shard
        run: |
          PYTHONPATH=. python scripts/similarity_blocal_flowqualified_route.py \
            --platform ${{ matrix.platform }} \
            --topology ${{ matrix.topology }} \
            --seed ${{ matrix.seed }} \
            --split ${{ matrix.geometry.split }} \
            --rows ${{ matrix.geometry.rows }} \
            --cols ${{ matrix.geometry.cols }} \
            --flow-root "$RUNNER_TEMP/orfs/flow"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: similarity-blocal-flowqualified-route-${{ matrix.platform }}-${{ matrix.topology }}-s${{ matrix.seed }}-r${{ matrix.geometry.rows }}c${{ matrix.geometry.cols }}
          path: |
            results/similarity_blocal_flowqualified/similarity_blocal_flowqualified_${{ matrix.platform }}_${{ matrix.topology }}_s${{ matrix.seed }}_r${{ matrix.geometry.rows }}_c${{ matrix.geometry.cols }}.csv
            results/similarity_blocal_flowqualified/flow_patch_${{ matrix.platform }}_${{ matrix.topology }}_s${{ matrix.seed }}_r${{ matrix.geometry.rows }}_c${{ matrix.geometry.cols }}.json
            build/similarity_blocal_flowqualified/${{ matrix.platform }}/${{ matrix.topology }}/s${{ matrix.seed }}/r${{ matrix.geometry.rows }}_c${{ matrix.geometry.cols }}/reports/*
            build/similarity_blocal_flowqualified/${{ matrix.platform }}/${{ matrix.topology }}/s${{ matrix.seed }}/r${{ matrix.geometry.rows }}_c${{ matrix.geometry.cols }}/logs/*.log
            build/similarity_blocal_flowqualified/${{ matrix.platform }}/${{ matrix.topology }}/s${{ matrix.seed }}/r${{ matrix.geometry.rows }}_c${{ matrix.geometry.cols }}/driver.log
          retention-days: 90

  validate:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Freeze flow-qualified prospective B-local replication')
    needs: [preflight, route]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v5
        with:
          pattern: similarity-blocal-flowqualified-*
          path: results/similarity_blocal_flowqualified_download
      - name: Apply every frozen all-required gate
        run: |
          PYTHONPATH=. python scripts/similarity_blocal_flowqualified_validate.py \
            --input results/similarity_blocal_flowqualified_download
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: similarity-blocal-flowqualified-final-summary
          path: results/similarity_blocal_flowqualified_summary.json
          retention-days: 90
