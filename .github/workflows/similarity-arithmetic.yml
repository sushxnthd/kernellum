name: SIMILARITY arithmetic-backend replication

on:
  pull_request:
    paths:
      - 'rtl/similarity_arithmetic_broadcast.sv'
      - 'scripts/similarity_arithmetic_route.py'
      - 'scripts/similarity_arithmetic_validate.py'
      - 'tests/test_similarity_arithmetic.py'
      - '.github/workflows/similarity-arithmetic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        device: [25k, 45k, 85k]
        backend: [dsp, lut]
        seed: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install ECP5 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys nextpnr-ecp5 fpga-trellis
      - name: Route arithmetic replication points
        run: |
          PYTHONPATH=. python scripts/similarity_arithmetic_route.py \
            --device ${{ matrix.device }} \
            --backend ${{ matrix.backend }} \
            --seed ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        with:
          name: arithmetic-${{ matrix.device }}-${{ matrix.backend }}-${{ matrix.seed }}
          path: results/similarity_arithmetic_${{ matrix.device }}_${{ matrix.backend }}_s${{ matrix.seed }}.csv

  validate:
    needs: route
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v5
        with:
          pattern: arithmetic-*
          path: results/similarity_arithmetic_download
          merge-multiple: true
      - name: Analyze frozen arithmetic-replication gate
        run: |
          python -m pip install numpy
          PYTHONPATH=. python scripts/similarity_arithmetic_validate.py
      - uses: actions/upload-artifact@v4
        with:
          name: similarity-arithmetic-validation
          path: |
            results/similarity_arithmetic_validation.json
            results/similarity_arithmetic_combined.csv
            results/similarity_arithmetic_points.csv
