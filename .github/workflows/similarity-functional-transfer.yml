name: SIMILARITY functional transfer

on:
  pull_request:
    paths:
      - 'docs/SIMILARITY_FUNCTIONAL_TRANSFER_PLAN.md'
      - 'rtl/kernellum_local_mac_array.sv'
      - 'rtl/kernellum_gemm_engine.sv'
      - 'rtl/kernellum_k1_pnr_top.sv'
      - 'rtl/tb_kernellum_local_gemm_engine.sv'
      - 'rtl/tb_kernellum_transport_equivalence.sv'
      - 'scripts/run_k1_sim.sh'
      - 'scripts/similarity_functional_route.py'
      - 'scripts/similarity_functional_validate.py'
      - 'kernellum/k1/model.py'
      - 'tests/test_k1.py'
      - 'tests/test_similarity_functional_transfer.py'
      - '.github/workflows/similarity-functional-transfer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Install simulation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Python tests
        run: |
          python -m pip install pytest numpy
          PYTHONPATH=. python -m pytest -q tests/test_k1.py tests/test_similarity_functional_transfer.py
      - name: Exact-output transport simulations
        run: bash scripts/run_k1_sim.sh
      - name: Record functional gate
        run: touch results/similarity_functional_simulation_passed
      - uses: actions/upload-artifact@v4
        with:
          name: functional-simulation
          path: results/similarity_functional_simulation_passed

  route:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        topology: [broadcast, local]
        seed: [23, 24, 25]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Install ECP5 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys nextpnr-ecp5 fpga-trellis
      - name: Route frozen functional corpus
        run: |
          PYTHONPATH=. python scripts/similarity_functional_route.py \
            --topology ${{ matrix.topology }} --seed ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        with:
          name: functional-${{ matrix.topology }}-s${{ matrix.seed }}
          path: results/similarity_functional_${{ matrix.topology }}_s${{ matrix.seed }}.csv

  validate:
    needs: [functional, route]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v5
        with:
          pattern: functional-*
          path: results/similarity_functional_download
          merge-multiple: true
      - name: Evaluate frozen functional-transfer gate
        run: |
          python -m pip install numpy
          PYTHONPATH=. python scripts/similarity_functional_validate.py
      - uses: actions/upload-artifact@v4
        with:
          name: similarity-functional-transfer-summary
          path: |
            results/similarity_functional_summary.json
            results/similarity_functional_combined.csv
            results/similarity_functional_points.csv
            results/similarity_functional_pairs.csv
            results/similarity_functional_policy.csv
            results/similarity_functional_workloads.csv
