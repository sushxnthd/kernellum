name: ARC identifiability probe-type robustness

on:
  push:
    branches:
      - research/arc-proposal-collapse-probe
    paths:
      - ".github/workflows/arc_identifiability_probe_ablation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  family:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        family:
          - task0bb8deee
          - task09c534e7
          - task0a2355a6
          - task0e671a1a
          - task137f0df0
          - task1d0a4b61
          - task182e5d0f
          - task1990f7a8
          - task1a6449f1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy scipy matplotlib shortuuid
      - name: Fetch pinned ARC-TGI
        run: |
          git clone https://github.com/Omega-Reasoning/ARC-Task-Generators-Inventory.git /tmp/ARC-TGI
          cd /tmp/ARC-TGI
          git checkout a614132ff5b2cb3628063d541e7cbd74a2cd2edb
          python -m pip install -r requirements.txt
      - name: Run probe-type ablation
        env:
          ARC_TGI_ROOT: /tmp/ARC-TGI
          PYTHONPATH: /tmp/ARC-TGI
          FAMILY: ${{ matrix.family }}
          CALL_TIMEOUT_S: "2.0"
          OUT_FILE: probe_ablation_${{ matrix.family }}.json
        run: python research/arc_reboot/identifiability_probe_ablation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-ablation-${{ matrix.family }}
          path: probe_ablation_${{ matrix.family }}.json
          if-no-files-found: warn
