name: K0.5 RTL and synthesis validation

on:
  pull_request:
    paths:
      - 'rtl/**'
      - 'scripts/synthesize_k05.py'
      - 'scripts/run_rtl_sim.sh'
      - 'kernellum/**'
      - 'tests/**'
      - '.github/workflows/k05-synthesis.yml'
  push:
    branches: [main]
    paths:
      - 'rtl/**'
      - 'scripts/synthesize_k05.py'
      - 'scripts/run_rtl_sim.sh'
      - 'kernellum/**'
      - 'tests/**'
      - '.github/workflows/k05-synthesis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install open-source HDL toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys iverilog
      - name: Tool versions
        run: |
          yosys -V
          iverilog -V | head -n 2
      - name: Python unit tests
        run: |
          python -m pip install pytest
          PYTHONPATH=. python -m pytest -q
      - name: RTL functional simulation
        run: bash scripts/run_rtl_sim.sh
      - name: Stratified Xilinx-7 synthesis
        run: PYTHONPATH=. python scripts/synthesize_k05.py
      - name: Publish machine-readable evidence to job summary
        run: |
          echo '## K0.5 validation' >> "$GITHUB_STEP_SUMMARY"
          echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
          cat results/k05_validation.json >> "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload synthesis evidence
        uses: actions/upload-artifact@v4
        with:
          name: kernellum-k05-synthesis
          path: |
            results/k05_synthesis.csv
            results/k05_validation.json
            build/k05/*.log
