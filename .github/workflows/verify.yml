name: verify

on:
  push:
    paths:
      - "kernellum/**"
      - "tests/**"
      - "scripts/run_eda.sh"
      - "scripts/run_ecp5.sh"
      - "scripts/run_onnx_eda.sh"
      - "scripts/build_onnx_demo.py"
      - "scripts/build_benchmark_matrix.py"
      - "artifacts/digits_int8/**"
      - "artifacts/onnx_digits/**"
      - "pyproject.toml"
      - ".github/workflows/verify.yml"
  pull_request:
    paths:
      - "kernellum/**"
      - "tests/**"
      - "scripts/run_eda.sh"
      - "scripts/run_ecp5.sh"
      - "scripts/run_onnx_eda.sh"
      - "scripts/build_onnx_demo.py"
      - "scripts/build_benchmark_matrix.py"
      - "artifacts/digits_int8/**"
      - "artifacts/onnx_digits/**"
      - "pyproject.toml"
      - ".github/workflows/verify.yml"
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-and-eda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: pip install -e '.[test,onnx]'
      - name: Run Python tests
        run: pytest -q
      - name: Regenerate v0.1 accelerator artifacts
        run: python -m kernellum --out artifacts/digits_int8
      - name: Build v0.2 ONNX demo accelerator
        run: python scripts/build_onnx_demo.py
      - name: Build multi-shape compiler benchmark matrix
        run: python scripts/build_benchmark_matrix.py
      - name: Install open-source EDA
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys
      - name: Run v0.1 RTL simulation and generic synthesis
        run: bash scripts/run_eda.sh
      - name: Run v0.1 ECP5 family-mapped synthesis
        run: bash scripts/run_ecp5.sh
      - name: Run v0.2 ONNX-generated RTL simulation and synthesis
        run: bash scripts/run_onnx_eda.sh
      - name: Upload EDA evidence
        uses: actions/upload-artifact@v4
        with:
          name: kernellum-eda-evidence
          path: |
            artifacts/digits_int8/rtl_sim.log
            artifacts/digits_int8/yosys_stat.log
            artifacts/digits_int8/yosys_ecp5_stat.log
            artifacts/onnx_digits/rtl_sim.log
            artifacts/onnx_digits/yosys_stat.log
            artifacts/onnx_digits/yosys_ecp5_stat.log
            artifacts/onnx_digits/manifest.json
            artifacts/benchmark_matrix/summary.json
            artifacts/benchmark_matrix/SUMMARY.md
            artifacts/benchmark_matrix/*/manifest.json
