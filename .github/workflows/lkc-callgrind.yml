name: LKC Callgrind frontier
on:
  push:
    branches: [lkc-stage1-superopt]
    paths:
      - '.github/workflows/lkc-callgrind.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  callgrind:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Setup benchmark harness
        run: |
          git clone -q https://github.com/shalashaska117/LeanKernelChallengeStage1Benchmark.git bench
          cd bench
          python3 benchmark.py setup --problem partition
          python3 benchmark.py doctor --problem partition --metric callgrind
      - name: Callgrind n36 candidates
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          cd bench
          for spec in             "closed:$root/lkc_stage1/candidate.lean"             "newton6mod:$root/lkc_stage1/diag_newton6mod.lean"             "newton6mask:$root/lkc_stage1/diag_newton6mask.lean"             "telmask:$root/lkc_stage1/diag_telmask.lean"             "newton6masknarrow:$root/lkc_stage1/diag_newton6mask_narrow.lean"
          do
            name="${spec%%:*}"; file="${spec#*:}"
            out="$root/callgrind-$name"
            echo "CALLGRIND $name"
            python3 benchmark.py diagnostic --problem partition --submission "$file" --inputs 36 --metric callgrind --repetitions 1 --timeout 600 --output "$out"
            python3 - "$out" "$name" <<'PY'
import json,sys,pathlib
out=pathlib.Path(sys.argv[1]); name=sys.argv[2]
p=out/"report.json"
d=json.loads(p.read_text())
print("REPORT",name,json.dumps(d.get("totals",{}),sort_keys=True))
for run in d.get("runs",[]):
    print("RUN",name,run.get("input"),run.get("median"),run.get("samples"))
PY
          done
