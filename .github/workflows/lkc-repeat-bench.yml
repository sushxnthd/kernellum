name: LKC endpoint repeat benchmark

on:
  push:
    branches: [lkc-stage1-superopt]
    paths:
      - '.github/workflows/lkc-repeat-bench.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Lean and pinned challenge
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          git clone -q https://github.com/SAIRcompetition/lean-kernel-challenge.git upstream
          cd upstream && git checkout -q 940f0a2ead23ef70ab1387edabb347e629111edd
      - name: Repeat baseline endpoint
        shell: bash
        run: |
          set -euo pipefail
          cp lkc_stage1/baseline_packed.lean upstream/problems/partition/Submission.lean
          cd upstream/problems/partition
          lake build >/dev/null
          {
            echo 'import Submission'
            echo 'set_option maxRecDepth 8000000'
            echo 'set_option maxHeartbeats 0'
            for i in $(seq 1 400); do echo "theorem b$i : Submission.impl 36 = 17977 := by rfl"; done
          } > Repeat.lean
          echo 'REPEAT BASELINE x400 n=36'
          /usr/bin/time -f 'elapsed=%e user=%U maxrss=%M' lake env lean Repeat.lean
      - name: Repeat closed-row endpoint
        shell: bash
        run: |
          set -euo pipefail
          cp lkc_stage1/candidate.lean upstream/problems/partition/Submission.lean
          cd upstream/problems/partition
          rm -f .lake/build/lib/lean/Submission.olean
          lake build >/dev/null
          {
            echo 'import Submission'
            echo 'set_option maxRecDepth 8000000'
            echo 'set_option maxHeartbeats 0'
            for i in $(seq 1 400); do echo "theorem c$i : Submission.impl 36 = 17977 := by rfl"; done
          } > Repeat.lean
          echo 'REPEAT CLOSED-ROW x400 n=36'
          /usr/bin/time -f 'elapsed=%e user=%U maxrss=%M' lake env lean Repeat.lean
      - name: Repeat one-shot endpoint
        shell: bash
        run: |
          set -euo pipefail
          cp lkc_stage1/oneshot_probe.lean upstream/problems/partition/OneShotProbe.lean
          cd upstream/problems/partition
          lake env lean OneShotProbe.lean -o .lake/build/lib/lean/OneShotProbe.olean
          {
            echo 'import OneShotProbe'
            echo 'set_option maxRecDepth 8000000'
            echo 'set_option maxHeartbeats 0'
            for i in $(seq 1 400); do echo "theorem o$i : OneShotProbe.impl 36 = 17977 := by rfl"; done
          } > Repeat.lean
          echo 'REPEAT ONESHOT x400 n=36'
          /usr/bin/time -f 'elapsed=%e user=%U maxrss=%M' lake env lean Repeat.lean
