name: Preserved pilot evidence audit
on:
  pull_request:
    paths:
      - 'scripts/audit_pilot_search.py'
      - 'evidence/pilot_search/**'
      - 'results/pilot_search/**'
      - '.github/workflows/pilot-evidence-audit.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/audit_pilot_search.py'
      - 'evidence/pilot_search/**'
      - 'results/pilot_search/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: python scripts/audit_pilot_search.py
