name: SIMILARITY ASAP7 flow canary

env:
  ORFS_IMAGE: openroad/orfs@sha256:573c1716efa0e286c4f641c26d343e20929d58d27fffbb22be2d0b93f09764f6

on:
  pull_request:
    paths:
      - 'asic/canary/**'
      - 'rtl/similarity_asic_canary.sv'
      - 'rtl/similarity_broadcast_fabric.sv'
      - 'rtl/similarity_local_fabric.sv'
      - 'scripts/similarity_asic_canary_validate.py'
      - 'docs/SIMILARITY_ASIC_ASAP7_CANARY_PLAN.md'
      - '.github/workflows/similarity-asic-asap7-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rtl-to-gds-asap7-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Check canary elaboration
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          iverilog -g2012 -s similarity_asic_broadcast_canary \
            -o /tmp/asic-broadcast-canary.vvp \
            rtl/similarity_broadcast_fabric.sv \
            rtl/similarity_local_fabric.sv \
            rtl/similarity_asic_canary.sv
          iverilog -g2012 -s similarity_asic_local_canary \
            -o /tmp/asic-local-canary.vvp \
            rtl/similarity_broadcast_fabric.sv \
            rtl/similarity_local_fabric.sv \
            rtl/similarity_asic_canary.sv

      - name: Prepare pinned OpenROAD flow
        run: |
          docker pull "$ORFS_IMAGE"
          mkdir -p "$RUNNER_TEMP/orfs"
          cid="$(docker create "$ORFS_IMAGE")"
          docker cp "$cid:/OpenROAD-flow-scripts/flow" "$RUNNER_TEMP/orfs/"
          docker rm "$cid"
          test -f "$RUNNER_TEMP/orfs/flow/Makefile"

      - name: Record pinned toolchain
        run: |
          mkdir -p build/asic_asap7_canary
          {
            printf 'flow_source=bundled_with_image\n'
            printf 'orfs_image=%s\n' "$ORFS_IMAGE"
            printf 'orfs_resolved_image=%s\n' \
              "$(docker image inspect --format '{{index .RepoDigests 0}}' "$ORFS_IMAGE")"
            printf 'platform=asap7\n'
            printf 'corner=BC\n'
            printf 'clock_period_ps=1000\n'
            docker run --rm "$ORFS_IMAGE" \
              bash -lc 'source /OpenROAD-flow-scripts/env.sh && openroad -version && yosys -V && klayout -v'
          } > build/asic_asap7_canary/toolchain.txt
          cat build/asic_asap7_canary/toolchain.txt

      - name: Route both canary topologies to GDS
        run: |
          repo_root="$PWD"
          orfs_root="$RUNNER_TEMP/orfs"
          for top in similarity_asic_broadcast_canary similarity_asic_local_canary; do
            docker run --rm \
              -v "$repo_root:/work:ro" \
              -v "$orfs_root/flow:/OpenROAD-flow-scripts/flow" \
              "$ORFS_IMAGE" \
              bash -lc "source /OpenROAD-flow-scripts/env.sh && \
                cd /OpenROAD-flow-scripts/flow && \
                make DESIGN_CONFIG=/work/asic/canary/config_asap7.mk DESIGN_NAME=$top clean_all && \
                make DESIGN_CONFIG=/work/asic/canary/config_asap7.mk DESIGN_NAME=$top"
          done

      - name: Verify and collect final artifacts
        run: |
          flow_root="$RUNNER_TEMP/orfs/flow"
          test -n "$(find "$flow_root/results/asap7" \
            -path '*similarity_asic_broadcast_canary*' -name '*.gds' -print -quit)"
          test -n "$(find "$flow_root/results/asap7" \
            -path '*similarity_asic_local_canary*' -name '*.gds' -print -quit)"
          cp -R "$flow_root/results/asap7/similarity_asic_broadcast_canary" \
            build/asic_asap7_canary/
          cp -R "$flow_root/results/asap7/similarity_asic_local_canary" \
            build/asic_asap7_canary/
          cp -R "$flow_root/reports/asap7/similarity_asic_broadcast_canary" \
            build/asic_asap7_canary/broadcast-reports
          cp -R "$flow_root/reports/asap7/similarity_asic_local_canary" \
            build/asic_asap7_canary/local-reports
          python3 scripts/similarity_asic_canary_validate.py \
            --artifact-root build/asic_asap7_canary \
            --platform asap7 \
            --output build/asic_asap7_canary/canary_validation.json
          find build/asic_asap7_canary -type f -printf '%p %s bytes\n' | sort

      - uses: actions/upload-artifact@v4
        with:
          name: similarity-asic-asap7-canary
          path: build/asic_asap7_canary
          retention-days: 30
