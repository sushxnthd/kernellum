name: ARC identifiability family 6 bisect first 50

on:
  push:
    branches:
      - research/arc-proposal-collapse-probe
    paths:
      - ".github/workflows/arc_identifiability_family6_bisect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {chunk: a, start: 0, end: 10}
          - {chunk: b, start: 10, end: 20}
          - {chunk: c, start: 20, end: 30}
          - {chunk: d, start: 30, end: 40}
          - {chunk: e, start: 40, end: 50}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy scipy matplotlib shortuuid
      - run: git clone --depth 1 https://github.com/Omega-Reasoning/ARC-Task-Generators-Inventory.git /tmp/ARC-TGI
      - name: Screen exact subchunk
        env:
          ARC_TGI_ROOT: /tmp/ARC-TGI
          PYTHONPATH: /tmp/ARC-TGI
          FAMILY_INDEX: "6"
          MODE: screen
          CHUNK_START: ${{ matrix.start }}
          CHUNK_END: ${{ matrix.end }}
          OUT_FILE: screen_${{ matrix.chunk }}.json
        run: python research/arc_reboot/identifiability_family_checkpointed.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family6-bisect-${{ matrix.chunk }}
          path: screen_${{ matrix.chunk }}.json
          if-no-files-found: warn
