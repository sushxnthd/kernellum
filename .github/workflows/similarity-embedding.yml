name: SIMILARITY topology embedding tax

on:
  pull_request:
    paths:
      - 'docs/SIMILARITY_EMBEDDING_TAX_PLAN.md'
      - 'rtl/similarity_shuffle_fabric.sv'
      - 'scripts/similarity_embedding_route.py'
      - 'scripts/similarity_embedding_validate.py'
      - 'tests/test_similarity_embedding.py'
      - '.github/workflows/similarity-embedding.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        topology: [local,shuffle]
        seed: [13,14,15]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install ECP5 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys nextpnr-ecp5 fpga-trellis
      - name: Route matched topology pair
        run: |
          PYTHONPATH=. python scripts/similarity_embedding_route.py             --topology ${{ matrix.topology }}             --seed ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        with:
          name: embedding-${{ matrix.topology }}-s${{ matrix.seed }}
          path: results/similarity_embedding_${{ matrix.topology }}_s${{ matrix.seed }}.csv

  validate:
    needs: route
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v5
        with:
          pattern: embedding-*
          path: results/similarity_embedding_download
          merge-multiple: true
      - name: Evaluate frozen embedding-tax gate
        run: |
          python -m pip install numpy
          PYTHONPATH=. python scripts/similarity_embedding_validate.py
      - uses: actions/upload-artifact@v4
        with:
          name: similarity-embedding-summary
          path: |
            results/similarity_embedding_summary.json
            results/similarity_embedding_combined.csv
