name: version-space-certificate-boundary

on:
  push:
    branches: [breakthrough-engine/support-aware-abstention-20261016]
    paths:
      - docs/VERSION_SPACE_CERTIFICATE_BOUNDARY_*.md
      - kernellum/discovery/version_space_certificate.py
      - scripts/evaluate_version_space_certificate_boundary.py
      - scripts/audit_version_space_certificate_boundary.py
      - results/version_space_certificate_boundary_*.json
      - tests/test_version_space_certificate.py
      - .github/workflows/version-space-certificate-boundary.yml
  pull_request:
    paths:
      - docs/VERSION_SPACE_CERTIFICATE_BOUNDARY_*.md
      - kernellum/discovery/version_space_certificate.py
      - scripts/evaluate_version_space_certificate_boundary.py
      - scripts/audit_version_space_certificate_boundary.py
      - results/version_space_certificate_boundary_*.json
      - tests/test_version_space_certificate.py
      - .github/workflows/version-space-certificate-boundary.yml
  workflow_dispatch:

jobs:
  exact-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[test]'
      - name: Reproduce exact theorem and opened diagnostic twice
        run: |
          python scripts/evaluate_version_space_certificate_boundary.py --output /tmp/result-1.json
          python scripts/evaluate_version_space_certificate_boundary.py --output /tmp/result-2.json
          cmp /tmp/result-1.json /tmp/result-2.json
          cmp /tmp/result-1.json results/version_space_certificate_boundary_result.json
      - name: Independent combinatorial audit
        run: |
          python scripts/audit_version_space_certificate_boundary.py \
            --result /tmp/result-1.json --output /tmp/audit.json
          cmp /tmp/audit.json results/version_space_certificate_boundary_audit.json
      - name: Runtime verifier regression
        run: python -m pytest -q tests/test_version_space_certificate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: version-space-certificate-boundary
          path: |
            /tmp/result-1.json
            /tmp/audit.json
