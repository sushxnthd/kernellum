name: SIMILARITY cross-technology ASIC transfer

env:
  ORFS_IMAGE: openroad/orfs@sha256:573c1716efa0e286c4f641c26d343e20929d58d27fffbb22be2d0b93f09764f6

on:
  pull_request:
    paths:
      - 'asic/transfer/**'
      - 'docs/SIMILARITY_ASIC_TRANSFER_PREREGISTRATION.md'
      - 'rtl/kernellum_mac_array.sv'
      - 'rtl/kernellum_local_mac_array.sv'
      - 'rtl/kernellum_gemm_engine.sv'
      - 'rtl/similarity_asic_transfer_top.sv'
      - 'rtl/tb_similarity_asic_transport_equivalence.sv'
      - 'scripts/openroad_qemu_wrapper.sh'
      - 'scripts/similarity_asic_transfer_route.py'
      - 'scripts/similarity_asic_transfer_validate.py'
      - 'tests/test_similarity_asic_transfer.py'
      - '.github/workflows/similarity-asic-transfer.yml'
  push:
    branches: [main]
    paths:
      - 'asic/transfer/**'
      - 'docs/SIMILARITY_ASIC_TRANSFER_PREREGISTRATION.md'
      - 'rtl/kernellum_mac_array.sv'
      - 'rtl/kernellum_local_mac_array.sv'
      - 'rtl/kernellum_gemm_engine.sv'
      - 'rtl/similarity_asic_transfer_top.sv'
      - 'rtl/tb_similarity_asic_transport_equivalence.sv'
      - 'scripts/openroad_qemu_wrapper.sh'
      - 'scripts/similarity_asic_transfer_route.py'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Install preflight tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          python -m pip install pytest
      - name: Check frozen validator
        run: PYTHONPATH=. python -m pytest -q tests/test_similarity_asic_transfer.py
      - name: Prove equivalence on every frozen geometry
        run: |
          mkdir -p build/asic_transfer_preflight results
          for geometry in '2 4' '4 2' '3 6' '6 3' '5 5' '7 7' '3 8' '8 3' '5 9' '9 5'; do
            set -- $geometry
            iverilog -g2012 -Wall -DSIM_ROWS=$1 -DSIM_COLS=$2 \
              -s tb_similarity_asic_transport_equivalence \
              -o build/asic_transfer_preflight/tb_${1}x${2}.out \
              rtl/kernellum_mac_array.sv \
              rtl/kernellum_local_mac_array.sv \
              rtl/kernellum_gemm_engine.sv \
              rtl/tb_similarity_asic_transport_equivalence.sv
            vvp build/asic_transfer_preflight/tb_${1}x${2}.out | \
              tee build/asic_transfer_preflight/tb_${1}x${2}.log
            grep -q KERNELLUM_ASIC_TRANSFER_EQUIVALENCE_PASS \
              build/asic_transfer_preflight/tb_${1}x${2}.log
          done
          touch results/similarity_asic_transfer_functional_passed
      - uses: actions/upload-artifact@v4
        with:
          name: similarity-asic-transfer-functional
          path: results/similarity_asic_transfer_functional_passed
          retention-days: 30

  route:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        platform: [nangate45, sky130hd]
        topology: [broadcast, local]
        seed: [11, 29, 47]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Install deterministic reporting support
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static
      - name: Prepare pinned OpenROAD flow
        run: |
          docker pull "$ORFS_IMAGE"
          mkdir -p "$RUNNER_TEMP/orfs"
          cid="$(docker create "$ORFS_IMAGE")"
          docker cp "$cid:/OpenROAD-flow-scripts/flow" "$RUNNER_TEMP/orfs/"
          docker rm "$cid"
          test -f "$RUNNER_TEMP/orfs/flow/Makefile"
      - name: Route frozen shard and retain nulls
        run: |
          PYTHONPATH=. python scripts/similarity_asic_transfer_route.py \
            --platform ${{ matrix.platform }} \
            --topology ${{ matrix.topology }} \
            --seed ${{ matrix.seed }} \
            --flow-root "$RUNNER_TEMP/orfs/flow"
      - name: Record pinned toolchain
        if: always()
        run: |
          shard=build/similarity_asic_transfer/${{ matrix.platform }}/${{ matrix.topology }}/s${{ matrix.seed }}
          mkdir -p "$shard"
          {
            printf 'flow_source=bundled_with_image\n'
            printf 'orfs_image=%s\n' "$ORFS_IMAGE"
            printf 'platform=%s\n' '${{ matrix.platform }}'
            printf 'topology=%s\n' '${{ matrix.topology }}'
            printf 'seed=%s\n' '${{ matrix.seed }}'
            qemu-x86_64-static --version
            docker run --rm "$ORFS_IMAGE" \
              bash -lc 'source /OpenROAD-flow-scripts/env.sh && openroad -version && yosys -V && klayout -v'
          } > "$shard/toolchain.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: similarity-asic-transfer-${{ matrix.platform }}-${{ matrix.topology }}-s${{ matrix.seed }}
          path: |
            results/similarity_asic_transfer_${{ matrix.platform }}_${{ matrix.topology }}_s${{ matrix.seed }}.csv
            build/similarity_asic_transfer/${{ matrix.platform }}/${{ matrix.topology }}/s${{ matrix.seed }}
          compression-level: 9
          retention-days: 30

  validate:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [preflight, route]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v5
        with:
          pattern: similarity-asic-transfer-*
          path: results/similarity_asic_transfer_download
          merge-multiple: true
      - name: Evaluate all frozen gates
        run: |
          PYTHONPATH=. python scripts/similarity_asic_transfer_validate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: similarity-asic-transfer-summary
          path: |
            results/similarity_asic_transfer_summary.json
            results/similarity_asic_transfer_combined.csv
            results/similarity_asic_transfer_pairs.csv
            results/similarity_asic_transfer_points.csv
          retention-days: 30
