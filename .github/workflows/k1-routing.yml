name: K1 routed architecture validation

on:
  pull_request:
    paths:
      - 'rtl/kernellum_gemm_engine.sv'
      - 'rtl/kernellum_k1_pnr_top.sv'
      - 'rtl/tb_kernellum_gemm_engine.sv'
      - 'scripts/run_k1_sim.sh'
      - 'scripts/run_k1_pnr.py'
      - 'kernellum/k1/**'
      - 'tests/test_k1.py'
      - '.github/workflows/k1-routing.yml'
  push:
    branches: [main]
    paths:
      - 'rtl/kernellum_gemm_engine.sv'
      - 'rtl/kernellum_k1_pnr_top.sv'
      - 'rtl/tb_kernellum_gemm_engine.sv'
      - 'scripts/run_k1_sim.sh'
      - 'scripts/run_k1_pnr.py'
      - 'kernellum/k1/**'
      - 'tests/test_k1.py'
      - '.github/workflows/k1-routing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install open-source ECP5 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys iverilog nextpnr-ecp5 fpga-trellis
      - name: Tool versions
        run: |
          yosys -V
          iverilog -V | head -n 2
          nextpnr-ecp5 --version
      - name: Python tests
        run: |
          python -m pip install pytest
          PYTHONPATH=. python -m pytest -q tests/test_k1.py tests/test_cost.py tests/test_search.py
      - name: K1 functional RTL simulation
        run: bash scripts/run_k1_sim.sh
      - name: K1 synthesis and place-and-route sweep
        run: PYTHONPATH=. python scripts/run_k1_pnr.py
      - name: Job summary
        run: |
          echo '## Kernellum K1' >> "$GITHUB_STEP_SUMMARY"
          echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
          cat results/k1_validation.json >> "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload K1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: kernellum-k1-routing
          path: |
            results/k1_routes.csv
            results/k1_workload_rankings.csv
            results/k1_validation.json
            build/k1/**/*
