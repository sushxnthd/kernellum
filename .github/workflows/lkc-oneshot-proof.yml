name: LKC one-shot proof loop

on:
  push:
    branches: [lkc-stage1-superopt]
    paths:
      - 'lkc_stage1/candidate_oneshot.lean'
      - '.github/workflows/lkc-oneshot-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Clone pinned challenge
        run: |
          git clone -q https://github.com/SAIRcompetition/lean-kernel-challenge.git upstream
          cd upstream
          git checkout -q 940f0a2ead23ef70ab1387edabb347e629111edd
      - name: Build challenger
        run: |
          cp lkc_stage1/candidate_oneshot.lean upstream/problems/partition/Submission.lean
          cd upstream/problems/partition
          lake build
      - name: Axiom audit
        run: |
          cd upstream/problems/partition
          printf 'import Submission\n#print axioms Submission.impl_correct\n' > Axioms.lean
          lake env lean Axioms.lean
      - name: Endpoint reductions
        shell: bash
        run: |
          set -euo pipefail
          cd upstream/problems/partition
          for pair in "14 135" "18 385" "22 1002" "26 2436" "32 8349" "36 17977" "100 190569292" "200 3972999029388" "300 9253082936723602" "500 2300165032574323995027"; do
            set -- $pair
            n=$1; v=$2
            printf 'import Submission\nset_option maxRecDepth 8000000\nset_option maxHeartbeats 0\nexample : Submission.impl %s = %s := by rfl\n' "$n" "$v" > Bench.lean
            echo "ONESHOT-CERT n=$n"
            /usr/bin/time -f 'elapsed=%e user=%U maxrss=%M' lake env lean Bench.lean
          done
