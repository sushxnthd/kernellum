name: SIMILARITY timing metric audit

on:
  pull_request:
    paths:
      - 'docs/SIMILARITY_TIMING_AUDIT.md'
      - 'scripts/similarity_timing_audit.py'
      - 'tests/test_similarity_timing_audit.py'
      - '.github/workflows/similarity-timing-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install ECP5 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys nextpnr-ecp5 fpga-trellis
      - name: Audit timing metric classes
        run: PYTHONPATH=. python scripts/similarity_timing_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: similarity-timing-audit
          path: |
            results/similarity_timing_audit.csv
            results/similarity_timing_audit.json
