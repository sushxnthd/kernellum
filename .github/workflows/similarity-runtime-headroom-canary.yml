name: SIMILARITY runtime/headroom flow canary

env:
  ORFS_IMAGE: openroad/orfs@sha256:573c1716efa0e286c4f641c26d343e20929d58d27fffbb22be2d0b93f09764f6

on:
  pull_request:
    paths:
      - 'asic/runtime_headroom_canary/**'
      - 'rtl/kernellum_mac_array.sv'
      - 'rtl/kernellum_local_mac_array.sv'
      - 'rtl/kernellum_blocal_mac_array.sv'
      - 'rtl/similarity_asic_transfer_top.sv'
      - 'rtl/similarity_asic_transfer_blocal.sv'
      - 'scripts/similarity_runtime_headroom_canary.py'
      - 'scripts/similarity_asic_transfer_route.py'
      - 'scripts/similarity_antenna_margin_canary.py'
      - 'scripts/similarity_blocal_qualified_route.py'
      - 'tests/test_similarity_runtime_headroom_canary.py'
      - 'docs/SIMILARITY_RUNTIME_HEADROOM_CANARY.md'
      - '.github/workflows/similarity-runtime-headroom-canary.yml'
  push:
    branches: [main]
    paths:
      - 'asic/runtime_headroom_canary/**'
      - 'rtl/kernellum_mac_array.sv'
      - 'rtl/kernellum_local_mac_array.sv'
      - 'rtl/kernellum_blocal_mac_array.sv'
      - 'rtl/similarity_asic_transfer_top.sv'
      - 'rtl/similarity_asic_transfer_blocal.sv'
      - 'scripts/similarity_runtime_headroom_canary.py'
      - 'scripts/similarity_asic_transfer_route.py'
      - 'scripts/similarity_antenna_margin_canary.py'
      - 'scripts/similarity_blocal_qualified_route.py'
      - 'tests/test_similarity_runtime_headroom_canary.py'
      - 'docs/SIMILARITY_RUNTIME_HEADROOM_CANARY.md'
      - '.github/workflows/similarity-runtime-headroom-canary.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Verify frozen protocol, flow and source
        run: |
          python -m pip install pytest
          PYTHONPATH=. python -m pytest -q tests/test_similarity_runtime_headroom_canary.py
          python -m py_compile \
            scripts/similarity_runtime_headroom_canary.py \
            scripts/similarity_asic_transfer_route.py
          grep -q 'Status: \*\*draft until merged to main; no route is eligible before that merge\*\*' \
            docs/SIMILARITY_RUNTIME_HEADROOM_CANARY.md
          grep -q 'STAGE_TIMEOUT_SECONDS = 7200' scripts/similarity_runtime_headroom_canary.py
          grep -q 'SEED = 373' scripts/similarity_runtime_headroom_canary.py
          for family in blocal controls; do
            for platform in nangate45 sky130hd; do
              grep -qx 'export CAP_MARGIN = 31' "asic/runtime_headroom_canary/${family}_config_${platform}.mk"
              grep -qx 'export SLEW_MARGIN = 25' "asic/runtime_headroom_canary/${family}_config_${platform}.mk"
            done
          done
          echo '6863f5e01d83d2833805a41824b0d1ef2bd6c92cc5c6626af6566c99037a77e6  rtl/kernellum_mac_array.sv' | sha256sum -c -
          echo '9e01f43a09d43ad62ca6582d87902b32c3691b8117dddaf0be7f542d157201ff  rtl/kernellum_local_mac_array.sv' | sha256sum -c -
          echo '7cdd3223ac401ec9c9df5a792cb41f2e754262dbd2c6fad103752fce7afdc766  rtl/kernellum_blocal_mac_array.sv' | sha256sum -c -
          echo '28159be6fffb2a74e15f64db6c013b018948c54546f43ec142a77070005bfc78  rtl/similarity_asic_transfer_top.sv' | sha256sum -c -
          echo '1f6bd084dab5e368f34dee5c44fb6ca12a68860b4b26fff2f78b85277d50552a  rtl/similarity_asic_transfer_blocal.sv' | sha256sum -c -
      - name: Compare signed GEMM on both opened canary shapes
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          mkdir -p results/similarity_runtime_headroom_functional
          for geometry in '7 10' '10 7'; do
            set -- $geometry
            iverilog -g2012 -Wall -DTEST_ROWS=$1 -DTEST_COLS=$2 \
              -s tb_kernellum_blocal_equivalence \
              -o "results/similarity_runtime_headroom_functional/tb_${1}x${2}.vvp" \
              rtl/kernellum_local_mac_array.sv \
              rtl/kernellum_blocal_mac_array.sv \
              rtl/tb_kernellum_blocal_equivalence.sv
            vvp "results/similarity_runtime_headroom_functional/tb_${1}x${2}.vvp" | \
              tee "results/similarity_runtime_headroom_functional/tb_${1}x${2}.log"
            grep -q "KERNELLUM_BLOCAL_EQUIVALENCE_PASS rows=$1 cols=$2" \
              "results/similarity_runtime_headroom_functional/tb_${1}x${2}.log"
          done
          git rev-parse HEAD > results/similarity_runtime_headroom_functional/source_sha.txt
          sha256sum \
            docs/SIMILARITY_RUNTIME_HEADROOM_CANARY.md \
            scripts/similarity_runtime_headroom_canary.py \
            scripts/similarity_asic_transfer_route.py \
            scripts/similarity_antenna_margin_canary.py \
            scripts/similarity_blocal_qualified_route.py \
            asic/runtime_headroom_canary/*.mk \
            rtl/kernellum_mac_array.sv \
            rtl/kernellum_local_mac_array.sv \
            rtl/kernellum_blocal_mac_array.sv \
            rtl/similarity_asic_transfer_top.sv \
            rtl/similarity_asic_transfer_blocal.sv \
            > results/similarity_runtime_headroom_functional/source_hashes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: similarity-runtime-headroom-functional
          path: results/similarity_runtime_headroom_functional/*
          retention-days: 90

  route:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Freeze opened-data runtime/headroom flow canary')
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        platform: [nangate45, sky130hd]
        topology: [broadcast, local, blocal]
        geometry:
          - {rows: 7, cols: 10}
          - {rows: 10, cols: 7}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Prepare pinned OpenROAD flow
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static
          docker pull "$ORFS_IMAGE"
          mkdir -p "$RUNNER_TEMP/orfs"
          cid="$(docker create "$ORFS_IMAGE")"
          docker cp "$cid:/OpenROAD-flow-scripts/flow" "$RUNNER_TEMP/orfs/"
          docker rm "$cid"
          test -f "$RUNNER_TEMP/orfs/flow/scripts/final_outputs.tcl"
          test -f "$RUNNER_TEMP/orfs/flow/scripts/global_route.tcl"
      - name: Route frozen opened-data canary shard
        run: |
          PYTHONPATH=. python scripts/similarity_runtime_headroom_canary.py \
            --platform ${{ matrix.platform }} \
            --topology ${{ matrix.topology }} \
            --rows ${{ matrix.geometry.rows }} \
            --cols ${{ matrix.geometry.cols }} \
            --flow-root "$RUNNER_TEMP/orfs/flow"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: similarity-runtime-headroom-${{ matrix.platform }}-${{ matrix.topology }}-s373-r${{ matrix.geometry.rows }}c${{ matrix.geometry.cols }}
          path: |
            results/similarity_runtime_headroom_canary/similarity_runtime_headroom_${{ matrix.platform }}_${{ matrix.topology }}_s373_r${{ matrix.geometry.rows }}_c${{ matrix.geometry.cols }}.csv
            results/similarity_runtime_headroom_canary/flow_patch_runtime_headroom_${{ matrix.platform }}_${{ matrix.topology }}_r${{ matrix.geometry.rows }}_c${{ matrix.geometry.cols }}.json
            build/similarity_runtime_headroom_canary/${{ matrix.platform }}/${{ matrix.topology }}/s373/r${{ matrix.geometry.rows }}_c${{ matrix.geometry.cols }}/reports/*
            build/similarity_runtime_headroom_canary/${{ matrix.platform }}/${{ matrix.topology }}/s373/r${{ matrix.geometry.rows }}_c${{ matrix.geometry.cols }}/logs/*.log
            build/similarity_runtime_headroom_canary/${{ matrix.platform }}/${{ matrix.topology }}/s373/r${{ matrix.geometry.rows }}_c${{ matrix.geometry.cols }}/driver.log
          retention-days: 90

  validate:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Freeze opened-data runtime/headroom flow canary')
    needs: [preflight, route]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v5
        with:
          pattern: similarity-runtime-headroom-*
          path: results/similarity_runtime_headroom_download
      - name: Apply every frozen all-required gate
        run: |
          PYTHONPATH=. python scripts/similarity_runtime_headroom_canary.py \
            --evaluate results/similarity_runtime_headroom_download
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: similarity-runtime-headroom-final-summary
          path: results/similarity_runtime_headroom_canary_summary.json
          retention-days: 90
