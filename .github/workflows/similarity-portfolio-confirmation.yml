name: SIMILARITY portfolio confirmation

on:
  pull_request:
    paths:
      - 'docs/SIMILARITY_PORTFOLIO_CONFIRMATION_PLAN.md'
      - 'scripts/similarity_portfolio_route.py'
      - 'scripts/similarity_portfolio_validate.py'
      - 'tests/test_similarity_portfolio_confirmation.py'
      - '.github/workflows/similarity-portfolio-confirmation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: python -m pip install pytest numpy && PYTHONPATH=. python -m pytest -q
      - run: bash scripts/run_k1_sim.sh
      - run: touch results/similarity_portfolio_simulation_passed
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-functional-simulation
          path: results/similarity_portfolio_simulation_passed

  route:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {phase: selection, topology: broadcast, seed: 41}
          - {phase: selection, topology: broadcast, seed: 42}
          - {phase: selection, topology: broadcast, seed: 43}
          - {phase: deployment, topology: broadcast, seed: 44}
          - {phase: deployment, topology: broadcast, seed: 45}
          - {phase: deployment, topology: broadcast, seed: 46}
          - {phase: deployment, topology: local, seed: 44}
          - {phase: deployment, topology: local, seed: 45}
          - {phase: deployment, topology: local, seed: 46}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: sudo apt-get update && sudo apt-get install -y yosys nextpnr-ecp5 fpga-trellis
      - run: |
          PYTHONPATH=. python scripts/similarity_portfolio_route.py \
            --phase ${{ matrix.phase }} --topology ${{ matrix.topology }} --seed ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-${{ matrix.phase }}-${{ matrix.topology }}-s${{ matrix.seed }}
          path: results/similarity_portfolio_${{ matrix.phase }}_${{ matrix.topology }}_s${{ matrix.seed }}.csv

  validate:
    needs: [functional, route]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v5
        with:
          pattern: portfolio-*
          path: results/similarity_portfolio_download
          merge-multiple: true
      - run: python -m pip install numpy && PYTHONPATH=. python scripts/similarity_portfolio_validate.py
      - uses: actions/upload-artifact@v4
        with:
          name: similarity-portfolio-confirmation-summary
          path: |
            results/similarity_portfolio_summary.json
            results/similarity_portfolio_combined.csv
            results/similarity_portfolio_selections.csv
            results/similarity_portfolio_workloads.csv
            results/similarity_portfolio_seed_summary.csv
            results/similarity_portfolio_pairs.csv
