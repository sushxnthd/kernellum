name: ARC map Land V6 Kaggle version

on:
  push:
    branches:
      - research/arc-proposal-collapse-probe
    paths:
      - "research/arc_reboot/LAND_V6_VERSION_MAP_TRIGGER"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "kagglehub==1.0.3"
      - name: Map scriptVersionId 286318109 using headers only
        run: |
          python - <<'PY'
          import json
          from kagglehub.clients import build_kaggle_client
          from kagglesdk.kernels.types.kernels_api_service import ApiDownloadKernelOutputRequest, ApiGetKernelRequest

          owner="johanland"; slug="johan-land-solver-v6-public"; target="286318109"
          rows=[]; selected=None
          with build_kaggle_client() as client:
              gr=ApiGetKernelRequest(); gr.user_name=owner; gr.kernel_slug=slug
              meta=client.kernels.kernels_api_client.get_kernel(gr)
              print("CURRENT_METADATA="+meta.to_json())
              current=int(getattr(meta,"current_version_number",0) or 0)
              if current<=0: current=100
              for v in range(1,current+1):
                  req=ApiDownloadKernelOutputRequest()
                  req.owner_slug=owner; req.kernel_slug=slug; req.version_number=v
                  try:
                      resp=client.kernels.kernels_api_client.download_kernel_output(req)
                      row={"version":v,"url":resp.url,"content_disposition":resp.headers.get("Content-Disposition")}
                      rows.append(row)
                      print("VERSION_HEADER="+json.dumps(row,sort_keys=True))
                      if target in str(resp.url):
                          selected=v
                      resp.close()
                  except Exception as e:
                      rows.append({"version":v,"error":repr(e)})
          open("land_v6_version_map.json","w").write(json.dumps({"target_script_version_id":target,"selected_version":selected,"versions":rows},indent=2))
          print("MAP_FINAL="+json.dumps({"target_script_version_id":target,"selected_version":selected},sort_keys=True))
          if selected is None:
              raise SystemExit("target scriptVersionId not mapped")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: land-v6-version-map
          path: land_v6_version_map.json
