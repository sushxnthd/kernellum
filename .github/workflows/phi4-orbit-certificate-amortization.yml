name: phi4-orbit-certificate-amortization

on:
  push:
    branches: ["breakthrough-engine/phi4-orbit-certificate-amortization-*"]
  pull_request:
    paths:
      - "experiments/phi4_orbit_certificate_amortization/**"
      - "kernellum/discovery/symmetry_orbit_starts.py"
      - "scripts/audit_phi4_orbit_certificate_amortization.py"
      - "tests/test_phi4_orbit_certificate_amortization.py"
      - "tests/test_symmetry_orbit_starts.py"
      - "docs/PHI4_ORBIT_CERTIFICATE_AMORTIZATION_*.md"
      - "results/phi4_orbit_certificate_amortization*"
      - ".github/workflows/phi4-orbit-certificate-amortization.yml"

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==2.3.5 scipy==1.17.0 pytest
      - name: Reproduce primary artifact twice
        run: |
          cp results/phi4_orbit_certificate_amortization.json /tmp/expected.json
          python experiments/phi4_orbit_certificate_amortization/run.py
          cmp results/phi4_orbit_certificate_amortization.json /tmp/expected.json
          cp results/phi4_orbit_certificate_amortization.json /tmp/first.json
          python experiments/phi4_orbit_certificate_amortization/run.py
          cmp results/phi4_orbit_certificate_amortization.json /tmp/first.json
      - name: Run independent exact checker
        run: |
          cp results/phi4_orbit_certificate_amortization_audit.json /tmp/expected-audit.json
          python scripts/audit_phi4_orbit_certificate_amortization.py
          cmp results/phi4_orbit_certificate_amortization_audit.json /tmp/expected-audit.json
      - name: Run focused tests
        run: PYTHONPATH=. python -m pytest -q tests/test_phi4_orbit_certificate_amortization.py tests/test_coupled_phi4_certified_routing.py tests/test_symmetry_orbit_starts.py
