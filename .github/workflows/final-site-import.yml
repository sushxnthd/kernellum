name: One-shot final site import
on:
  push:
    paths:
      - '.github/workflows/final-site-import.yml'

permissions:
  contents: write

jobs:
  import-final-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import secured final site archive
        env:
          ZIP_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-9608-820e-812d-705528f2e435/raw?se=2026-09-24T10%3A40%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=dbdf9d7a-4e2d-5dbd-866f-5e5674fa42b0&skoid=5e5afa93-cb2e-42ad-a58a-830b5b446f03&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T08%3A20%3A45Z&ske=2026-09-25T08%3A20%3A45Z&sks=b&skv=2026-02-06&sig=Ayk1fC97gczpYLnf/qMQ0LyIYTMWIHAXfXadWQJe56Q%3D'
        run: |
          set -euo pipefail
          curl --fail --location "$ZIP_URL" --output /tmp/kernellum-final.zip
          echo "204dd925d64c92a3ad35114bd453abde18c6a7215f2d2540bf7f1303495dbb95  /tmp/kernellum-final.zip" | sha256sum -c -
          rm -rf /tmp/kernellum-final
          mkdir -p /tmp/kernellum-final
          unzip -q /tmp/kernellum-final.zip -d /tmp/kernellum-final
          test -f /tmp/kernellum-final/docs/index.html

          rm -rf docs
          cp -a /tmp/kernellum-final/docs ./docs

          if [ -d /tmp/kernellum-final/scripts ]; then
            mkdir -p scripts
            cp -a /tmp/kernellum-final/scripts/. ./scripts/
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs scripts
          if git diff --cached --quiet; then
            echo "Archive already matches repository."
            exit 0
          fi
          git commit -m "Publish secured final Kernellum site"
          git push origin HEAD:main
