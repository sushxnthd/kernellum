name: Joint acquisition-predictor published evidence integrity
on:
  pull_request:
    paths:
      - 'experiments/joint_revision/**'
      - 'kernellum/discovery/**'
      - '.github/workflows/joint-revision.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 uqtestfuns==0.6.0 pytest
      - run: python -m pytest -q
      - run: python scripts/verify_development_snapshot.py results/joint_revision/development
