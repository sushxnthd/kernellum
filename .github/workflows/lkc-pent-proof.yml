name: LKC pentagonal proof probe
on:
  push:
    branches: [lkc-stage1-superopt]
    paths:
      - 'lkc_stage1/pent_proof_probe.lean'
      - 'lkc_stage1/candidate_tel.lean'
      - '.github/workflows/lkc-pent-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Setup and prove
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.1
          source "$HOME/.elan/env"
          git clone -q https://github.com/SAIRcompetition/lean-kernel-challenge.git upstream
          cd upstream && git checkout -q 940f0a2ead23ef70ab1387edabb347e629111edd
          cp "$GITHUB_WORKSPACE/lkc_stage1/candidate_tel.lean" problems/partition/Submission.lean
          cd problems/partition
          lake build
          cp "$GITHUB_WORKSPACE/lkc_stage1/pent_proof_probe.lean" PentProofProbe.lean
          /usr/bin/time -f 'proof_elapsed=%e maxrss=%M' lake env lean PentProofProbe.lean
