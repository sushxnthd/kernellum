name: benchmark-pnr

on:
  push:
    paths:
      - "kernellum/compiler.py"
      - "kernellum/onnx_frontend.py"
      - "kernellum/ir.py"
      - "scripts/build_benchmark_matrix.py"
      - "scripts/run_benchmark_pnr_sweep_ulx3s_85f.sh"
      - "boards/ulx3s_85f/kernellum_demo.lpf"
      - ".github/workflows/benchmark-pnr.yml"
  workflow_dispatch:

concurrency:
  group: benchmark-pnr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  multi-shape-ulx3s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: pip install -e '.[test,onnx]'
      - name: Build deterministic compiler shape matrix
        run: python scripts/build_benchmark_matrix.py
      - name: Install ECP5 physical-design toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys nextpnr-ecp5 fpga-trellis
      - name: Run KRN-BENCH-001 multi-workload P&R sweep
        run: bash scripts/run_benchmark_pnr_sweep_ulx3s_85f.sh
      - name: Upload KRN-BENCH-001 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernellum-krn-bench-001
          path: |
            artifacts/benchmark_matrix/summary.json
            artifacts/benchmark_matrix/SUMMARY.md
            artifacts/benchmark_matrix/*/manifest.json
            artifacts/benchmark_matrix/*/kernellum_dense3_accel.sv
            artifacts/benchmark_matrix/*/kernellum_demo_top.sv
            artifacts/benchmark_pnr_ulx3s_85f/summary.json
            artifacts/benchmark_pnr_ulx3s_85f/SUMMARY.md
            artifacts/benchmark_pnr_ulx3s_85f/*/summary.json
            artifacts/benchmark_pnr_ulx3s_85f/*/SUMMARY.md
            artifacts/benchmark_pnr_ulx3s_85f/*/kernellum_demo_top.bit
            artifacts/benchmark_pnr_ulx3s_85f/*/lanes*/yosys.log
            artifacts/benchmark_pnr_ulx3s_85f/*/lanes*/nextpnr.log
            artifacts/benchmark_pnr_ulx3s_85f/*/lanes*/route_exit_code.txt
            artifacts/benchmark_pnr_ulx3s_85f/*/lanes*/kernellum_demo_top.json
            artifacts/benchmark_pnr_ulx3s_85f/*/lanes*/kernellum_demo_top.config
          if-no-files-found: warn
