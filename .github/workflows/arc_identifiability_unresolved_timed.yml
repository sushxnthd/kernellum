name: ARC identifiability unresolved families timed-validity recovery

on:
  push:
    branches:
      - research/arc-proposal-collapse-probe
    paths:
      - ".github/workflows/arc_identifiability_unresolved_timed.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  family:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        idx: [6,11,14,24,27,37]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy scipy matplotlib shortuuid
      - run: git clone --depth 1 https://github.com/Omega-Reasoning/ARC-Task-Generators-Inventory.git /tmp/ARC-TGI
      - name: Run frozen family with explicit execution-validity timeout
        env:
          ARC_TGI_ROOT: /tmp/ARC-TGI
          PYTHONPATH: /tmp/ARC-TGI
          SHARD_START: ${{ matrix.idx }}
          SHARD_END: ${{ matrix.idx }}
          CALL_TIMEOUT_S: "2.0"
          OUT_FILE: identifiability_family_${{ matrix.idx }}_timed.json
        run: |
          export SHARD_END=$(( ${{ matrix.idx }} + 1 ))
          python research/arc_reboot/identifiability_kill_test_train_timed.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identifiability-family-${{ matrix.idx }}-timed
          path: identifiability_family_${{ matrix.idx }}_timed.json
          if-no-files-found: warn
