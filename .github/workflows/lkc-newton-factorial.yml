name: LKC Newton factorial benchmark
on:
  push:
    branches: [lkc-stage1-superopt]
    paths:
      - 'lkc_stage1/newton6_mod_probe.lean'
      - 'lkc_stage1/newton6_mask_narrow_probe.lean'
      - '.github/workflows/lkc-newton-factorial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          source "$HOME/.elan/env"
          git clone -q https://github.com/SAIRcompetition/lean-kernel-challenge.git upstream
          cd upstream && git checkout -q 940f0a2ead23ef70ab1387edabb347e629111edd
          cd problems/partition && lake build Spec
      - name: Build probes
        run: |
          cp lkc_stage1/newton_probe.lean upstream/problems/partition/NewtonProbe.lean
          cp lkc_stage1/newton6_mod_probe.lean upstream/problems/partition/Newton6ModProbe.lean
          cp lkc_stage1/newton_mask_probe.lean upstream/problems/partition/NewtonMaskProbe.lean
          cp lkc_stage1/newton6_mask_narrow_probe.lean upstream/problems/partition/Newton6MaskNarrowProbe.lean
          cp lkc_stage1/tel_mask_probe.lean upstream/problems/partition/TelMaskProbe.lean
          cp lkc_stage1/tel_mask_narrow_probe.lean upstream/problems/partition/TelMaskNarrowProbe.lean
          cd upstream/problems/partition
          for f in NewtonProbe Newton6ModProbe NewtonMaskProbe Newton6MaskNarrowProbe TelMaskProbe TelMaskNarrowProbe; do lake env lean "$f.lean" -o ".lake/build/lib/lean/$f.olean"; done
      - name: Compare x1000 n36
        shell: bash
        run: |
          set -euo pipefail
          cd upstream/problems/partition
          for mod in NewtonProbe Newton6ModProbe NewtonMaskProbe Newton6MaskNarrowProbe TelMaskProbe TelMaskNarrowProbe; do
            {
              echo "import $mod"
              echo 'set_option maxRecDepth 8000000'
              echo 'set_option maxHeartbeats 0'
              ns=$mod
              for i in $(seq 1 1000); do echo "theorem q$i : $ns.impl 36 = 17977 := by rfl"; done
            } > Repeat.lean
            echo "FACTORIAL $mod x1000 n36"
            /usr/bin/time -f 'elapsed=%e user=%U maxrss=%M' lake env lean Repeat.lean
          done
