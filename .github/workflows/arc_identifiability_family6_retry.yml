name: ARC identifiability family 6 infrastructure retry

on:
  push:
    branches:
      - research/arc-proposal-collapse-probe
    paths:
      - ".github/workflows/arc_identifiability_family6_retry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  family6:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy scipy matplotlib shortuuid
      - run: git clone --depth 1 https://github.com/Omega-Reasoning/ARC-Task-Generators-Inventory.git /tmp/ARC-TGI
      - name: Run frozen family 6
        env:
          ARC_TGI_ROOT: /tmp/ARC-TGI
          PYTHONPATH: /tmp/ARC-TGI
          SHARD_START: "6"
          SHARD_END: "7"
          OUT_FILE: identifiability_family_6_retry.json
        run: python research/arc_reboot/identifiability_kill_test_train_shard.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identifiability-family-6-retry
          path: identifiability_family_6_retry.json
          if-no-files-found: warn
