name: SIMILARITY causal mechanism

on:
  pull_request:
    paths:
      - 'rtl/similarity_broadcast_fabric.sv'
      - 'rtl/similarity_local_fabric.sv'
      - 'scripts/similarity_mechanism_route.py'
      - 'scripts/similarity_mechanism_validate.py'
      - 'tests/test_similarity_mechanism.py'
      - '.github/workflows/similarity-mechanism.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        device: [25k, 45k, 85k]
        topology: [broadcast, local]
        seed: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install ECP5 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys nextpnr-ecp5 fpga-trellis
      - name: Route mechanism points
        run: |
          PYTHONPATH=. python scripts/similarity_mechanism_route.py \
            --device ${{ matrix.device }} \
            --topology ${{ matrix.topology }} \
            --seed ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        with:
          name: mechanism-${{ matrix.device }}-${{ matrix.topology }}-${{ matrix.seed }}
          path: results/similarity_mechanism_${{ matrix.device }}_${{ matrix.topology }}_s${{ matrix.seed }}.csv

  validate:
    needs: route
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v5
        with:
          pattern: mechanism-*
          path: results/similarity_mechanism_download
          merge-multiple: true
      - name: Analyze preregistered causal gate
        run: |
          python -m pip install numpy
          PYTHONPATH=. python scripts/similarity_mechanism_validate.py
      - uses: actions/upload-artifact@v4
        with:
          name: similarity-mechanism-validation
          path: |
            results/similarity_mechanism_validation.json
            results/similarity_mechanism_combined.csv
            results/similarity_mechanism_points.csv
