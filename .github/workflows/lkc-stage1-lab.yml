name: LKC partition lab

on:
  push:
    branches: [lkc-stage1-superopt]
    paths:
      - 'lkc_stage1/**'
      - '.github/workflows/lkc-stage1-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Clone pinned challenge
        run: |
          git clone https://github.com/SAIRcompetition/lean-kernel-challenge.git upstream
          cd upstream
          git checkout 940f0a2ead23ef70ab1387edabb347e629111edd
      - name: Build baseline
        run: |
          cp lkc_stage1/baseline_packed.lean upstream/problems/partition/Submission.lean
          cd upstream/problems/partition
          lake build
      - name: Benchmark baseline endpoints
        shell: bash
        run: |
          set -euo pipefail
          cd upstream/problems/partition
          for pair in "14 135" "18 385" "22 1002" "26 2436" "32 8349" "36 17977"; do
            set -- $pair
            n=$1; v=$2
            printf 'import Submission\nexample : Submission.impl %s = %s := by rfl\n' "$n" "$v" > Bench.lean
            echo "BASELINE n=$n"
            /usr/bin/time -f 'elapsed=%e user=%U maxrss=%M' lake env lean Bench.lean
          done
      - name: Build candidate
        run: |
          cp lkc_stage1/candidate.lean upstream/problems/partition/Submission.lean
          cd upstream/problems/partition
          rm -rf .lake/build/lib/lean/Submission.olean .lake/build/ir/Submission.c
          lake build
      - name: Candidate axiom audit
        run: |
          cd upstream/problems/partition
          printf 'import Submission\n#print axioms Submission.impl_correct\n' > Axioms.lean
          lake env lean Axioms.lean
      - name: Benchmark candidate endpoints
        shell: bash
        run: |
          set -euo pipefail
          cd upstream/problems/partition
          for pair in "14 135" "18 385" "22 1002" "26 2436" "32 8349" "36 17977"; do
            set -- $pair
            n=$1; v=$2
            printf 'import Submission\nexample : Submission.impl %s = %s := by rfl\n' "$n" "$v" > Bench.lean
            echo "CANDIDATE n=$n"
            /usr/bin/time -f 'elapsed=%e user=%U maxrss=%M' lake env lean Bench.lean
          done
