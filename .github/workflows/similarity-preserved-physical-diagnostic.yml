name: SIMILARITY preserved-replica physical diagnostic

env:
  ORFS_IMAGE: openroad/orfs@sha256:573c1716efa0e286c4f641c26d343e20929d58d27fffbb22be2d0b93f09764f6

on:
  pull_request:
    paths:
      - 'rtl/kernellum_preserved_selective_mac_array.sv'
      - 'rtl/similarity_asic_transfer_preserved.sv'
      - 'rtl/tb_kernellum_preserved_equivalence.sv'
      - 'asic/preserved/**'
      - 'scripts/similarity_preserved_*.py'
      - 'docs/SIMILARITY_PRESERVED_PHYSICAL_DIAGNOSTIC_PLAN.md'
      - '.github/workflows/similarity-preserved-physical-diagnostic.yml'
  push:
    branches: [main]
    paths:
      - 'rtl/kernellum_preserved_selective_mac_array.sv'
      - 'rtl/similarity_asic_transfer_preserved.sv'
      - 'rtl/tb_kernellum_preserved_equivalence.sv'
      - 'asic/preserved/**'
      - 'scripts/similarity_preserved_*.py'
      - 'docs/SIMILARITY_PRESERVED_PHYSICAL_DIAGNOSTIC_PLAN.md'
      - '.github/workflows/similarity-preserved-physical-diagnostic.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Verify frozen contract and scripts
        run: |
          grep -q 'Status: \*\*exploratory repair protocol fixed before physical routing\*\*' docs/SIMILARITY_PRESERVED_PHYSICAL_DIAGNOSTIC_PLAN.md
          python -m py_compile scripts/similarity_preserved_route.py scripts/similarity_preserved_validate.py
          for platform in nangate45 sky130hd; do
            grep -qx 'export CAP_MARGIN = 20' "asic/preserved/config_${platform}.mk"
            grep -qx 'export SLEW_MARGIN = 20' "asic/preserved/config_${platform}.mk"
          done
      - name: Compare signed GEMM on opened shapes
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          mkdir -p results/similarity_preserved_preflight
          for geometry in '5 8' '8 5'; do
            set -- $geometry
            iverilog -g2012 -Wall -DTEST_ROWS=$1 -DTEST_COLS=$2 \
              -s tb_kernellum_preserved_equivalence \
              -o "results/similarity_preserved_preflight/tb_${1}x${2}.vvp" \
              rtl/kernellum_local_mac_array.sv \
              rtl/kernellum_preserved_selective_mac_array.sv \
              rtl/tb_kernellum_preserved_equivalence.sv
            vvp "results/similarity_preserved_preflight/tb_${1}x${2}.vvp" | \
              tee "results/similarity_preserved_preflight/tb_${1}x${2}.log"
            grep -q KERNELLUM_PRESERVED_EQUIVALENCE_PASS \
              "results/similarity_preserved_preflight/tb_${1}x${2}.log"
          done
          touch results/similarity_preserved_preflight/similarity_preserved_functional_passed
          git rev-parse HEAD > results/similarity_preserved_preflight/source_sha.txt
          sha256sum docs/SIMILARITY_PRESERVED_PHYSICAL_DIAGNOSTIC_PLAN.md \
            scripts/similarity_preserved_route.py scripts/similarity_preserved_validate.py \
            rtl/kernellum_preserved_selective_mac_array.sv \
            rtl/similarity_asic_transfer_preserved.sv asic/preserved/config_*.mk \
            > results/similarity_preserved_preflight/source_hashes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: similarity-preserved-functional
          path: results/similarity_preserved_preflight/*
          retention-days: 30

  route:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        platform: [nangate45, sky130hd]
        seed: [53, 71, 89]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Prepare pinned OpenROAD flow
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static
          docker pull "$ORFS_IMAGE"
          mkdir -p "$RUNNER_TEMP/orfs"
          cid="$(docker create "$ORFS_IMAGE")"
          docker cp "$cid:/OpenROAD-flow-scripts/flow" "$RUNNER_TEMP/orfs/"
          docker rm "$cid"
          test -f "$RUNNER_TEMP/orfs/flow/Makefile"
      - name: Route both opened shapes
        run: |
          PYTHONPATH=. python scripts/similarity_preserved_route.py \
            --platform ${{ matrix.platform }} \
            --seed ${{ matrix.seed }} \
            --flow-root "$RUNNER_TEMP/orfs/flow"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: similarity-preserved-route-${{ matrix.platform }}-s${{ matrix.seed }}
          path: |
            results/similarity_preserved_${{ matrix.platform }}_s${{ matrix.seed }}.csv
            build/similarity_preserved_physical/${{ matrix.platform }}/preserved/s${{ matrix.seed }}/**/reports/*.rpt
            build/similarity_preserved_physical/${{ matrix.platform }}/preserved/s${{ matrix.seed }}/**/reports/synth_stat.txt
            build/similarity_preserved_physical/${{ matrix.platform }}/preserved/s${{ matrix.seed }}/**/logs/*.log
            build/similarity_preserved_physical/${{ matrix.platform }}/preserved/s${{ matrix.seed }}/**/driver.log
          retention-days: 30

  validate:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [preflight, route]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v5
        with:
          pattern: similarity-preserved-*
          path: results/similarity_preserved_download
      - name: Apply frozen opened-data gate
        run: |
          PYTHONPATH=. python scripts/similarity_preserved_validate.py \
            --input results/similarity_preserved_download
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: similarity-preserved-final-summary
          path: results/similarity_preserved_summary.json
          retention-days: 90
