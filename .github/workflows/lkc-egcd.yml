name: LKC extended GCD probe
on:
  push:
    branches: [lkc-stage1-superopt]
    paths:
      - 'lkc_stage1/egcd*.lean'
      - '.github/workflows/lkc-egcd.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          source "$HOME/.elan/env"
          git clone -q https://github.com/SAIRcompetition/lean-kernel-challenge.git upstream
          cd upstream && git checkout -q 940f0a2ead23ef70ab1387edabb347e629111edd
          cd problems/partition && lake build Spec
      - name: Build and compare
        shell: bash
        run: |
          set -euo pipefail
          cp lkc_stage1/egcd_probe.lean upstream/problems/partition/EGcdProbe.lean
          cp lkc_stage1/egcd_narrow_probe.lean upstream/problems/partition/EGcdNarrowProbe.lean
          cd upstream/problems/partition
          for mod in EGcdProbe EGcdNarrowProbe; do
            lake env lean "$mod.lean" -o ".lake/build/lib/lean/$mod.olean"
            for pair in "14 135" "18 385" "22 1002" "26 2436" "32 8349" "36 17977"; do
              set -- $pair; n=$1; v=$2
              printf 'import %s\nset_option maxRecDepth 8000000\nset_option maxHeartbeats 0\nexample : %s.impl %s = %s := by rfl\n' "$mod" "$mod" "$n" "$v" > Probe.lean
              lake env lean Probe.lean
            done
            {
              echo "import $mod"
              echo 'set_option maxRecDepth 8000000'
              echo 'set_option maxHeartbeats 0'
              for i in $(seq 1 1000); do echo "theorem q$i : $mod.impl 36 = 17977 := by rfl"; done
            } > Repeat.lean
            echo "EGCD $mod x1000 n36"
            /usr/bin/time -f 'elapsed=%e user=%U maxrss=%M' lake env lean Repeat.lean
          done
