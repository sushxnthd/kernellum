name: ARC fetch Land public V7 traces

on:
  push:
    branches:
      - research/arc-proposal-collapse-probe
    paths:
      - "research/arc_reboot/LAND_TRACE_FETCH_TRIGGER"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "kagglehub>=1.0.0"
      - name: Download public notebook output
        run: |
          python - <<'PY'
          import os, json, pathlib, kagglehub
          out = pathlib.Path("/tmp/land_v7")
          out.mkdir(parents=True, exist_ok=True)
          try:
              p = kagglehub.notebook_output_download(
                  "johanland/johan-land-solver-v7-public",
                  output_dir=str(out)
              )
              print("DOWNLOAD_PATH", p)
          except TypeError:
              p = kagglehub.notebook_output_download("johanland/johan-land-solver-v7-public")
              print("DOWNLOAD_PATH", p)
              out = pathlib.Path(p)
          files=[]
          for x in sorted(out.rglob("*")):
              if x.is_file():
                  files.append({"path":str(x.relative_to(out)),"bytes":x.stat().st_size})
          print("FILE_COUNT",len(files))
          print("TOTAL_BYTES",sum(x["bytes"] for x in files))
          print("FILE_MANIFEST="+json.dumps(files[:2000]))
          pathlib.Path("land_v7_manifest.json").write_text(json.dumps(files,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: land-v7-manifest
          path: land_v7_manifest.json
          if-no-files-found: warn
