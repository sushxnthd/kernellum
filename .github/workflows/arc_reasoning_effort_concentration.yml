name: ARC reasoning-effort concentration audit

on:
  push:
    branches:
      - research/arc-proposal-collapse-probe
    paths:
      - "research/arc_reboot/reasoning_effort_concentration.py"
      - ".github/workflows/arc_reasoning_effort_concentration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install huggingface_hub
      - run: git clone --depth 1 https://github.com/arcprize/ARC-AGI-2.git /tmp/ARC-AGI-2
      - name: Run within-family effort sweep
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python research/arc_reboot/reasoning_effort_concentration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc-reasoning-effort-concentration
          path: reasoning_effort_concentration.json
          if-no-files-found: warn
