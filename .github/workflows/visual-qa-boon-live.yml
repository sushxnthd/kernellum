name: Visual QA live mirror
# targeted section QA pass 2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/visual-qa-boon-live.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Capture original and mirror
        run: |
          cat > qa.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({headless:true});
          const errors = [];

          async function capture(name,url,viewport){
            const context = await browser.newContext({
              viewport,
              deviceScaleFactor: 1,
              colorScheme: 'dark'
            });
            const page = await context.newPage();
            page.on('console', msg => {
              if(msg.type()==='error') errors.push(`${name} console: ${msg.text()}`);
            });
            page.on('pageerror', err => errors.push(`${name} pageerror: ${err.message}`));
            page.on('requestfailed', req => errors.push(`${name} requestfailed: ${req.url()} :: ${req.failure()?.errorText}`));

            await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForTimeout(5000);
            await page.screenshot({path:`qa/${name}-top.png`,fullPage:false});
            const topInfo = await page.evaluate(() => {
              const rect = el => {
                if(!el) return null;
                const r=el.getBoundingClientRect(), cs=getComputedStyle(el);
                return {x:r.x,y:r.y,w:r.width,h:r.height,font:cs.fontFamily,fontSize:cs.fontSize,lineHeight:cs.lineHeight,letterSpacing:cs.letterSpacing,textAlign:cs.textAlign,transform:cs.transform,opacity:cs.opacity};
              };
              const title=document.querySelector('.page-header.home .title');
              return {
                header:rect(document.querySelector('#header')),
                nav:rect(document.querySelector('#header .nav-bar')),
                heroTitle:rect(title),
                heroKids:title ? [...title.children].map(rect) : [],
                subtitle:rect(document.querySelector('.page-header.home .subtitle')),
                scrollCue:rect(document.querySelector('.page-header.home .scroll')),
                center1:rect(document.querySelectorAll('.centered-text')[0]?.querySelector('.text')),
                center2:rect(document.querySelectorAll('.centered-text')[1]?.querySelector('.text'))
              };
            });
            fs.writeFileSync(`qa/${name}-top-metrics.json`,JSON.stringify(topInfo,null,2));

            await page.evaluate(()=>scrollTo(0,innerHeight*.85));
            await page.waitForTimeout(1800);
            await page.screenshot({path:`qa/${name}-scroll1.png`,fullPage:false});

            await page.evaluate(()=>scrollTo(0,document.documentElement.scrollHeight*.45));
            await page.waitForTimeout(1800);
            await page.screenshot({path:`qa/${name}-scroll2.png`,fullPage:false});

            const info = await page.evaluate(() => {
              const rect = el => {
                if(!el) return null;
                const r=el.getBoundingClientRect(), cs=getComputedStyle(el);
                return {x:r.x,y:r.y,w:r.width,h:r.height,font:cs.fontFamily,fontSize:cs.fontSize,lineHeight:cs.lineHeight,letterSpacing:cs.letterSpacing,textAlign:cs.textAlign,transform:cs.transform,opacity:cs.opacity};
              };
              const title=document.querySelector('.page-header.home .title');
              const titleKids=title ? [...title.children].map(rect) : [];
              return {
                title: document.title,
                bodyText: document.body.innerText.slice(0,400),
                height: document.documentElement.scrollHeight,
                canvases: document.querySelectorAll('canvas').length,
                links: document.querySelectorAll('a').length,
                loader: !!document.querySelector('#loader'),
                header: rect(document.querySelector('#header')),
                nav: rect(document.querySelector('#header .nav-bar')),
                heroTitle: rect(title),
                heroTitleKids:titleKids,
                subtitle:rect(document.querySelector('.page-header.home .subtitle')),
                scrollCue:rect(document.querySelector('.page-header.home .scroll')),
                heroImages:[...document.querySelectorAll('.page-header.home .image-wrapper')].map(rect),
                centered2:rect(document.querySelectorAll('.centered-text')[1]?.querySelector('.text'))
              };
            });
            fs.writeFileSync(`qa/${name}.json`,JSON.stringify(info,null,2));

            for (const [label, sel] of [['cards','section.card-grid.three-wide'],['large','section.large-text'],['sock','section.sock']]) {
              const loc=page.locator(sel).first();
              if(await loc.count()){
                await loc.scrollIntoViewIfNeeded();
                await page.waitForTimeout(1200);
                await page.screenshot({path:`qa/${name}-${label}.png`,fullPage:false});
              }
            }
            await context.close();
          }

          fs.mkdirSync('qa',{recursive:true});
          await capture('boon-desktop','https://www.boonglobal.io/',{width:1440,height:1000});
          await capture('rebuild-desktop','https://sushxnthd.github.io/kernellum/boon-rebuild/?qa=1',{width:1440,height:1000});
          await capture('boon-mobile','https://www.boonglobal.io/',{width:390,height:844});
          await capture('rebuild-mobile','https://sushxnthd.github.io/kernellum/boon-rebuild/?qa=1',{width:390,height:844});
          fs.writeFileSync('qa/errors.txt',errors.join('\n'));
          await browser.close();
          JS
          node qa.mjs
          echo "---- QA ERRORS ----"
          cat qa/errors.txt || true
          echo "---- MIRROR INFO ----"
          cat qa/rebuild-desktop.json
          cat qa/rebuild-mobile.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boon-live-visual-qa
          path: qa/
          retention-days: 3
