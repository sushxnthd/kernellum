name: ARC proposal collapse probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "transformers>=4.46,<4.48" sentencepiece safetensors
      - name: Fetch ARC-AGI-2
        run: |
          git clone --depth 1 https://github.com/arcprize/ARC-AGI-2.git
      - name: Run matched proposal-distribution probe
        env:
          TOKENIZERS_PARALLELISM: "false"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python research/arc_reboot/proposal_collapse_probe.py \
            --arc-dir ARC-AGI-2/data/training \
            --model Qwen/Qwen2.5-0.5B-Instruct \
            --tasks 20 \
            --max-new-tokens 96 \
            --out proposal_collapse_probe_results.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-proposal-collapse-probe
          path: proposal_collapse_probe_results.json
          if-no-files-found: warn
