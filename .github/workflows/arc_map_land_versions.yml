name: ARC map Land V7 Kaggle versions

on:
  push:
    branches:
      - research/arc-proposal-collapse-probe
    paths:
      - "research/arc_reboot/LAND_VERSION_MAP_TRIGGER"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "kagglehub==1.0.3"
      - name: Probe public notebook output headers without downloading archives
        run: |
          python - <<'PY'
          import json
          from kagglehub.clients import build_kaggle_client
          from kagglesdk.kernels.types.kernels_api_service import ApiDownloadKernelOutputRequest, ApiGetKernelRequest

          owner="johanland"
          slug="johan-land-solver-v7-public"
          rows=[]
          with build_kaggle_client() as client:
              gr=ApiGetKernelRequest()
              gr.user_name=owner
              gr.kernel_slug=slug
              meta=client.kernels.kernels_api_client.get_kernel(gr)
              print("CURRENT_METADATA="+meta.to_json())
              for v in range(1,40):
                  req=ApiDownloadKernelOutputRequest()
                  req.owner_slug=owner
                  req.kernel_slug=slug
                  req.version_number=v
                  try:
                      resp=client.kernels.kernels_api_client.download_kernel_output(req)
                      row={
                          "version":v,
                          "status":getattr(resp,"status_code",None),
                          "content_length":resp.headers.get("Content-Length"),
                          "content_type":resp.headers.get("Content-Type"),
                          "content_disposition":resp.headers.get("Content-Disposition"),
                          "last_modified":resp.headers.get("Last-Modified"),
                          "url":resp.url,
                      }
                      rows.append(row)
                      print("VERSION_HEADER="+json.dumps(row,sort_keys=True))
                      resp.close()
                  except Exception as e:
                      row={"version":v,"error":repr(e)}
                      rows.append(row)
                      print("VERSION_HEADER="+json.dumps(row,sort_keys=True))
          open("land_v7_version_headers.json","w").write(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: land-v7-version-headers
          path: land_v7_version_headers.json
          if-no-files-found: warn
