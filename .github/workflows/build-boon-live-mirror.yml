name: Build live BOON mirror preview

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-boon-live-mirror.yml'

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Crawl the live BOON production frontend
        shell: bash
        run: |
          set -euo pipefail
          rm -rf docs/boon-live
          mkdir -p docs/boon-live/_nuxt

          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          from collections import deque
          import re, time

          ORIGIN = "https://www.boonglobal.io"
          OUT = Path("docs/boon-live")
          NUXT = OUT / "_nuxt"
          BASE = "/kernellum/boon-live/"

          def get(url, binary=True):
              req = Request(url, headers={"User-Agent":"Mozilla/5.0 (Kernellum frontend compatibility mirror)"})
              last = None
              for n in range(3):
                  try:
                      with urlopen(req, timeout=45) as r:
                          return r.read()
                  except Exception as e:
                      last = e
                      time.sleep(1+n)
              raise last

          html = get(ORIGIN + "/").decode("utf-8")
          original_html = html

          # Seed from every production Nuxt JS/CSS asset explicitly referenced by SSR.
          seed = sorted(set(re.findall(r'/_nuxt/([A-Za-z0-9_.~-]+\.(?:js|css))', html)))
          q = deque(seed)
          seen = set()
          missing = set()

          # Chunk filenames in Vite/Nuxt bundles. We probe candidates against the live origin,
          # so false-positive strings are harmless.
          candidate_re = re.compile(r'(?<![A-Za-z0-9_/.-])([A-Za-z0-9_.~-]{5,}\.(?:js|css))(?![A-Za-z0-9_.-])')
          import_re = re.compile(r'(?:from\s*|import\s*\(|new\s+URL\s*\()\s*["\'](?:\./)?([^"\']+\.(?:js|css))')

          while q:
              name = q.popleft()
              name = name.split("?")[0].lstrip("./")
              if name in seen or "/" in name or not name.endswith((".js",".css")):
                  continue
              seen.add(name)
              url = f"{ORIGIN}/_nuxt/{name}"
              try:
                  data = get(url)
              except Exception:
                  missing.add(name)
                  continue
              (NUXT/name).write_bytes(data)

              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue

              candidates = set(candidate_re.findall(text))
              candidates |= set(import_re.findall(text))
              for cand in sorted(candidates):
                  cand = cand.split("?")[0].lstrip("./")
                  if "/" not in cand and cand not in seen:
                      q.append(cand)

          # Fetch the exact build payload referenced by this SSR response.
          payload_match = re.search(r'data-src=["\']([^"\']*_payload\.json[^"\']*)', original_html)
          if payload_match:
              payload_url = payload_match.group(1)
              if payload_url.startswith("/"):
                  payload_url = ORIGIN + payload_url
              payload = get(payload_url)
              (OUT/"_payload.json").write_bytes(payload)

          # Localize all Nuxt production resources to the mirrored chunk tree.
          html = re.sub(r'(["\'])/_nuxt/', rf'\1{BASE}_nuxt/', html)
          html = re.sub(r'(["\'])/_payload\.json', rf'\1{BASE}_payload.json', html)

          # Nuxt app/router must regard the GitHub Pages preview folder as its base route.
          html = html.replace('app:{baseURL:"/",', f'app:{{baseURL:"{BASE}",')
          html = html.replace('buildAssetsDir:"/_nuxt/"', 'buildAssetsDir:"_nuxt/"')
          html = html.replace('prefix:"/_scripts"', f'prefix:"{ORIGIN}/_scripts"')

          # CSS font URLs are relative to /_nuxt/ on BOON. Keep the exact production font
          # resources on their original origin rather than copying the binaries into the repo.
          for css in NUXT.glob("*.css"):
              text = css.read_text("utf-8")
              text = re.sub(
                  r'url\((["\']?)(?:\.\./)?fonts/([^)"\']+)\1\)',
                  lambda m: 'url("' + ORIGIN + '/fonts/' + m.group(2) + '")',
                  text
              )
              # Any root Nuxt asset URL created inside CSS should point into this mirror.
              text = text.replace('url("/_nuxt/', f'url("{BASE}_nuxt/')
              text = text.replace("url('/_nuxt/", f"url('{BASE}_nuxt/")
              css.write_text(text, "utf-8")

          # Runtime chunks sometimes construct absolute build paths at runtime.
          for js in NUXT.glob("*.js"):
              try:
                  text = js.read_text("utf-8")
              except UnicodeDecodeError:
                  continue
              text = text.replace('"/_nuxt/', f'"{BASE}_nuxt/')
              text = text.replace("'/_nuxt/", f"'{BASE}_nuxt/")
              js.write_text(text, "utf-8")

          # Branding patch only. Preserve BOON's component DOM so hydration remains exact.
          html = re.sub(r'<title>.*?</title>', '<title>Kernellum</title>', html, count=1, flags=re.S|re.I)
          branding = r'''
          <style id="kernellum-brand-patch">
          a.logo{position:relative!important}
          a.logo>svg{opacity:0!important}
          a.logo:after{
            content:"KERNELLUM";position:absolute;inset:0;
            display:flex;align-items:center;justify-content:center;
            font-family:MSCHN,sans-serif;font-weight:500;
            font-size:clamp(.9rem,.3vw + .82rem,1.05rem);
            letter-spacing:.02em;color:currentColor;pointer-events:none;white-space:nowrap
          }
          footer svg[aria-label],footer a>svg{opacity:0}
          </style>
          <script>
          (() => {
            const patch = () => {
              document.title = "Kernellum";
              document.querySelectorAll('[aria-label="Boon"],[aria-label="BOON"]').forEach(el => el.setAttribute('aria-label','Kernellum'));
            };
            patch();
            new MutationObserver(patch).observe(document.documentElement,{subtree:true,childList:true});
          })();
          </script>
          '''
          html = html.replace("</head>", branding + "</head>", 1)

          (OUT/"index.html").write_text(html, "utf-8")
          (OUT/".nojekyll").write_text("", "utf-8")
          (OUT/"MIRROR_REPORT.txt").write_text(
              "Live BOON production crawl\n"
              f"Build assets discovered: {len(seen)}\n"
              f"Successfully mirrored: {len(list(NUXT.glob('*')))}\n"
              f"Unresolved candidates: {len(missing)}\n\n"
              + "\n".join(sorted(missing)),
              "utf-8"
          )
          print(f"Seed assets: {len(seed)}")
          print(f"Discovered chunks: {len(seen)}")
          print(f"Mirrored chunks: {len(list(NUXT.glob('*')))}")
          print(f"Unresolved candidates: {len(missing)}")
          PY

      - name: Verify local dependency closure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path("docs/boon-live")
          html=(root/"index.html").read_text("utf-8")
          refs=set(re.findall(r'/kernellum/boon-live/_nuxt/([A-Za-z0-9_.~-]+\.(?:js|css))',html))
          missing=[x for x in sorted(refs) if not (root/"_nuxt"/x).exists()]
          print("initial local refs:",len(refs),"missing:",len(missing))
          if missing:
              print("\n".join(missing))
              raise SystemExit(1)
          PY

      - name: Commit mirror preview
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/boon-live
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Rebuild Kernellum preview from live BOON production frontend"
          git push
