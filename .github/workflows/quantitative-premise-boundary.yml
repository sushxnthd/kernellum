name: quantitative-premise-boundary

on:
  push:
    branches: [breakthrough-engine/quantitative-premise-boundary-20261018]
  pull_request:
    paths:
      - docs/QUANTITATIVE_PREMISE_BOUNDARY_*.md
      - kernellum/discovery/quantitative_premise.py
      - scripts/*quantitative_premise_boundary.py
      - results/quantitative_premise_boundary_*.json
      - tests/test_quantitative_premise.py
      - .github/workflows/quantitative-premise-boundary.yml
  workflow_dispatch:

jobs:
  exact-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[test]'
      - name: Reproduce fixed screen twice
        run: |
          python scripts/evaluate_quantitative_premise_boundary.py --output /tmp/result-1.json
          python scripts/evaluate_quantitative_premise_boundary.py --output /tmp/result-2.json
          cmp /tmp/result-1.json /tmp/result-2.json
          cmp /tmp/result-1.json results/quantitative_premise_boundary_result.json
      - name: Independent artifact audit
        run: |
          python scripts/audit_quantitative_premise_boundary.py --result /tmp/result-1.json --output /tmp/audit.json
          cmp /tmp/audit.json results/quantitative_premise_boundary_audit.json
      - name: Runtime regression
        run: python -m pytest -q tests/test_quantitative_premise.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quantitative-premise-boundary
          path: |
            /tmp/result-1.json
            /tmp/audit.json
