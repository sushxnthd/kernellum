name: SIMILARITY mechanism independent confirmation

on:
  pull_request:
    paths:
      - 'docs/SIMILARITY_MECHANISM_CONFIRMATION_PLAN.md'
      - 'scripts/similarity_mechanism_confirm_route.py'
      - 'scripts/similarity_mechanism_confirm_validate.py'
      - 'tests/test_similarity_mechanism_confirmation.py'
      - '.github/workflows/similarity-mechanism-confirmation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        device: [25k,45k,85k]
        topology: [broadcast,local]
        seed: [4,5,6]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install ECP5 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys nextpnr-ecp5 fpga-trellis
      - name: Route independent rectangular corpus
        run: |
          PYTHONPATH=. python scripts/similarity_mechanism_confirm_route.py             --device ${{ matrix.device }}             --topology ${{ matrix.topology }}             --seed ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        with:
          name: mechanism-confirm-${{ matrix.device }}-${{ matrix.topology }}-s${{ matrix.seed }}
          path: results/similarity_mechanism_confirm_${{ matrix.device }}_${{ matrix.topology }}_s${{ matrix.seed }}.csv

  validate:
    needs: route
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v5
        with:
          pattern: mechanism-confirm-*
          path: results/similarity_mechanism_confirm_download
          merge-multiple: true
      - name: Evaluate frozen differential law
        run: |
          python -m pip install numpy
          PYTHONPATH=. python scripts/similarity_mechanism_confirm_validate.py
      - uses: actions/upload-artifact@v4
        with:
          name: similarity-mechanism-confirmation
          path: |
            results/similarity_mechanism_confirmation_summary.json
            results/similarity_mechanism_confirmation_combined.csv
