name: Project SIMILARITY routed corpus

on:
  pull_request:
    paths:
      - 'scripts/similarity_route_shard.py'
      - 'scripts/similarity_discover.py'
      - 'scripts/similarity_validate.py'
      - 'tests/test_similarity.py'
      - '.github/workflows/similarity-corpus.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        device: [25k, 45k, 85k]
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install ECP5 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys nextpnr-ecp5 fpga-trellis
      - name: Route corpus shard
        run: |
          PYTHONPATH=. python scripts/similarity_route_shard.py \
            --device ${{ matrix.device }} \
            --shard ${{ matrix.shard }} \
            --shards 6
      - uses: actions/upload-artifact@v4
        with:
          name: similarity-${{ matrix.device }}-${{ matrix.shard }}
          path: results/similarity_${{ matrix.device }}_shard_${{ matrix.shard }}.csv

  discover:
    needs: route
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v5
        with:
          pattern: similarity-45k-*
          path: results/similarity_discovery
          merge-multiple: true
      - name: Fit discovery law without held-out devices
        run: |
          python -m pip install numpy
          PYTHONPATH=. python scripts/similarity_discover.py
      - uses: actions/upload-artifact@v4
        with:
          name: similarity-frozen-law
          path: |
            results/similarity_frozen_law.json
            results/similarity_discovery_metrics.json
            results/similarity_45k_combined.csv

  validate:
    needs: [route, discover]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v5
        with:
          name: similarity-frozen-law
          path: results
      - uses: actions/download-artifact@v5
        with:
          pattern: similarity-85k-*
          path: results/similarity_85k
          merge-multiple: true
      - uses: actions/download-artifact@v5
        with:
          pattern: similarity-25k-*
          path: results/similarity_25k
          merge-multiple: true
      - name: Evaluate frozen law on held-out devices and workloads
        run: |
          python -m pip install numpy
          PYTHONPATH=. python scripts/similarity_validate.py
      - uses: actions/upload-artifact@v4
        with:
          name: similarity-validation
          path: |
            results/similarity_validation.json
            results/similarity_85k_combined.csv
            results/similarity_25k_combined.csv
            results/similarity_workload_validation.csv
