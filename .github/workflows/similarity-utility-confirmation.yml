name: SIMILARITY utility confirmation

on:
  pull_request:
    paths:
      - 'docs/SIMILARITY_UTILITY_CONFIRMATION_PLAN.md'
      - 'scripts/similarity_utility_route.py'
      - 'scripts/similarity_utility_validate.py'
      - 'tests/test_similarity_utility_confirmation.py'
      - '.github/workflows/similarity-utility-confirmation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Install simulation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Python tests
        run: |
          python -m pip install pytest numpy
          PYTHONPATH=. python -m pytest -q \
            tests/test_k1.py \
            tests/test_similarity_functional_transfer.py \
            tests/test_similarity_depth_codesign.py \
            tests/test_similarity_utility_confirmation.py
      - name: Exact-output transport simulations
        run: bash scripts/run_k1_sim.sh
      - name: Record functional gate
        run: touch results/similarity_utility_simulation_passed
      - uses: actions/upload-artifact@v4
        with:
          name: utility-functional-simulation
          path: results/similarity_utility_simulation_passed

  route:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        topology: [broadcast, local]
        seed: [32, 33, 34]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Install ECP5 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys nextpnr-ecp5 fpga-trellis
      - name: Route frozen utility corpus
        run: |
          PYTHONPATH=. python scripts/similarity_utility_route.py \
            --topology ${{ matrix.topology }} --seed ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        with:
          name: utility-${{ matrix.topology }}-s${{ matrix.seed }}
          path: results/similarity_utility_${{ matrix.topology }}_s${{ matrix.seed }}.csv

  validate:
    needs: [functional, route]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v5
        with:
          pattern: utility-*
          path: results/similarity_utility_download
          merge-multiple: true
      - name: Evaluate frozen utility-confirmation gate
        run: |
          python -m pip install numpy
          PYTHONPATH=. python scripts/similarity_utility_validate.py
      - uses: actions/upload-artifact@v4
        with:
          name: similarity-utility-confirmation-summary
          path: |
            results/similarity_utility_summary.json
            results/similarity_utility_combined.csv
            results/similarity_utility_points.csv
            results/similarity_utility_pairs.csv
            results/similarity_utility_policy.csv
            results/similarity_utility_workloads.csv
            results/similarity_utility_seed_workloads.csv
            results/similarity_utility_seed_summary.csv
            results/similarity_utility_depth_comparison.csv
