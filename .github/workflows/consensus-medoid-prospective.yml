name: consensus-medoid-prospective

on:
  push:
    branches:
      - breakthrough-engine/consensus-medoid-prospective-20261018
    paths:
      - docs/CONSENSUS_MEDOID_PROSPECTIVE_PROTOCOL.md
      - scripts/evaluate_consensus_medoid_prospective.py
      - scripts/audit_consensus_medoid_prospective.py
      - .github/workflows/consensus-medoid-prospective.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prospective:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[test]'
      - name: Execute frozen prospective selector twice
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          python scripts/evaluate_consensus_medoid_prospective.py --decisions results/consensus_medoid_prospective_decisions.json --output results/consensus_medoid_prospective_result.json
          cp results/consensus_medoid_prospective_decisions.json /tmp/consensus-decisions-first.json
          cp results/consensus_medoid_prospective_result.json /tmp/consensus-result-first.json
          python scripts/evaluate_consensus_medoid_prospective.py --decisions results/consensus_medoid_prospective_decisions.json --output results/consensus_medoid_prospective_result.json
          cmp /tmp/consensus-decisions-first.json results/consensus_medoid_prospective_decisions.json
          cmp /tmp/consensus-result-first.json results/consensus_medoid_prospective_result.json
      - name: Independent aggregation audit
        run: python scripts/audit_consensus_medoid_prospective.py --decisions results/consensus_medoid_prospective_decisions.json --result results/consensus_medoid_prospective_result.json --output results/consensus_medoid_prospective_audit.json
      - name: Preserve frozen raw results on branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/consensus_medoid_prospective_decisions.json results/consensus_medoid_prospective_result.json results/consensus_medoid_prospective_audit.json
          if git diff --cached --quiet; then
            echo "Frozen artifacts are already current."
          else
            git commit -m "research: record consensus-medoid prospective result"
            git push origin HEAD:$GITHUB_REF_NAME
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consensus-medoid-prospective
          path: |
            results/consensus_medoid_prospective_decisions.json
            results/consensus_medoid_prospective_result.json
            results/consensus_medoid_prospective_audit.json
