name: consensus-medoid-prospective

on:
  push:
    branches:
      - breakthrough-engine/consensus-medoid-prospective-20261018
    paths:
      - docs/CONSENSUS_MEDOID_PROSPECTIVE_*.md
      - scripts/evaluate_consensus_medoid_prospective.py
      - scripts/audit_consensus_medoid_prospective.py
      - .github/workflows/consensus-medoid-prospective.yml
  workflow_dispatch:

jobs:
  prospective:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[test]'
      - name: Execute frozen prospective selector twice
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          python scripts/evaluate_consensus_medoid_prospective.py --decisions consensus-decisions.json --output consensus-result.json
          cp consensus-decisions.json /tmp/consensus-decisions-first.json
          cp consensus-result.json /tmp/consensus-result-first.json
          python scripts/evaluate_consensus_medoid_prospective.py --decisions consensus-decisions.json --output consensus-result.json
          cmp /tmp/consensus-decisions-first.json consensus-decisions.json
          cmp /tmp/consensus-result-first.json consensus-result.json
      - name: Independent aggregation audit
        run: python scripts/audit_consensus_medoid_prospective.py --decisions consensus-decisions.json --result consensus-result.json --output consensus-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consensus-medoid-prospective
          path: |
            consensus-decisions.json
            consensus-result.json
            consensus-audit.json
