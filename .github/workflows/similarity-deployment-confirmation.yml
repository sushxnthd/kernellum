name: SIMILARITY deployment confirmation

on:
  pull_request:
    paths:
      - 'docs/SIMILARITY_DEPLOYMENT_CONFIRMATION_PLAN.md'
      - 'scripts/similarity_deployment_route.py'
      - 'scripts/similarity_deployment_validate.py'
      - 'tests/test_similarity_deployment_confirmation.py'
      - '.github/workflows/similarity-deployment-confirmation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: python -m pip install pytest numpy && PYTHONPATH=. python -m pytest -q
      - run: bash scripts/run_k1_sim.sh
      - run: touch results/similarity_deployment_simulation_passed
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-functional-simulation
          path: results/similarity_deployment_simulation_passed

  route:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {phase: selection, topology: broadcast, seed: 35}
          - {phase: selection, topology: broadcast, seed: 36}
          - {phase: selection, topology: broadcast, seed: 37}
          - {phase: deployment, topology: broadcast, seed: 38}
          - {phase: deployment, topology: broadcast, seed: 39}
          - {phase: deployment, topology: broadcast, seed: 40}
          - {phase: deployment, topology: local, seed: 38}
          - {phase: deployment, topology: local, seed: 39}
          - {phase: deployment, topology: local, seed: 40}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: sudo apt-get update && sudo apt-get install -y yosys nextpnr-ecp5 fpga-trellis
      - run: |
          PYTHONPATH=. python scripts/similarity_deployment_route.py \
            --phase ${{ matrix.phase }} --topology ${{ matrix.topology }} --seed ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ matrix.phase }}-${{ matrix.topology }}-s${{ matrix.seed }}
          path: results/similarity_deployment_${{ matrix.phase }}_${{ matrix.topology }}_s${{ matrix.seed }}.csv

  validate:
    needs: [functional, route]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v5
        with:
          pattern: deployment-*
          path: results/similarity_deployment_download
          merge-multiple: true
      - run: python -m pip install numpy && PYTHONPATH=. python scripts/similarity_deployment_validate.py
      - uses: actions/upload-artifact@v4
        with:
          name: similarity-deployment-confirmation-summary
          path: |
            results/similarity_deployment_summary.json
            results/similarity_deployment_combined.csv
            results/similarity_deployment_selections.csv
            results/similarity_deployment_workloads.csv
            results/similarity_deployment_seed_summary.csv
            results/similarity_deployment_pairs.csv
