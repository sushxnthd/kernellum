name: Temporary site motion QA # final-font-pass

on:
  push:
    paths:
      - '.github/workflows/site-motion-qa.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Run motion audit
        shell: bash
        run: |
          mkdir -p /tmp/site/kernellum qa-screens
          cp -a docs/. /tmp/site/kernellum/
          python3 -m http.server 4173 -d /tmp/site >/tmp/kernellum-http.log 2>&1 &
          cat > qa.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const pages=['','what-we-do/','who-we-are/','careers/','contact/'];
          const viewports=[['desktop',1440,1000],['mobile',390,844]];
          let failed=false;
          for(const [mode,width,height] of viewports){
            for(const path of pages){
              const context=await browser.newContext({viewport:{width,height},reducedMotion:'no-preference'});
              const page=await context.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push('pageerror:'+e.message));
              page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
              page.on('requestfailed',r=>errors.push('requestfailed:'+r.url()+' '+(r.failure()?.errorText||'')));
              const url='http://127.0.0.1:4173/kernellum/'+path;
              await page.goto(url,{waitUntil:'networkidle',timeout:60000});
              await page.waitForTimeout(1400);
              const state=await page.evaluate(()=>{
                const h=document.querySelector('h1');
                const p=document.querySelector('p');
                const canvas=document.querySelector('canvas');
                return {
                  title:document.title,
                  height:document.documentElement.scrollHeight,
                  h1Font:h?getComputedStyle(h).fontFamily:null,
                  bodyFont:p?getComputedStyle(p).fontFamily:getComputedStyle(document.body).fontFamily,
                  displayLoaded:document.fonts.check('500 16px "Space Grotesk"'),
                  bodyLoaded:document.fonts.check('400 16px "IBM Plex Sans"'),
                  canvas:!!canvas,
                  signal:getComputedStyle(document.documentElement).getPropertyValue('--krn-signal').trim()||getComputedStyle(document.documentElement).getPropertyValue('--signal').trim()
                };
              });
              if(mode==='desktop'){
                const menu=page.locator('.expand-btn').first();
                if(await menu.count()){
                  await menu.hover();await page.waitForTimeout(650);
                  const hoverDots=await page.locator('.dotgrid i,.k-menu-grid .dot-grid .dot').count();
                  await menu.click();await page.waitForTimeout(650);
                  const closeDots=await page.locator('.dotgrid i,.k-menu-grid .dot-grid .dot').count();
                  console.log('MENU',path||'home','hoverDots='+hoverDots,'closeDots='+closeDots);
                  if(closeDots!==6)errors.push('menu close pattern expected 6 got '+closeDots);
                  await menu.click();await page.waitForTimeout(500);
                }
                const footerLink=page.locator('footer nav.primary a,.k-footer-primary a').first();
                if(await footerLink.count()){
                  await footerLink.scrollIntoViewIfNeeded();await page.waitForTimeout(350);await footerLink.hover();await page.waitForTimeout(650);
                  const opacities=await page.locator('footer nav.primary a .dot-icon .dot,.k-footer-primary a .footer-dot-icon i').first().evaluateAll(els=>els.map(e=>Number(getComputedStyle(e).opacity)));
                  console.log('FOOTER',path||'home',JSON.stringify(opacities));
                  if(opacities.length&&!opacities.some(x=>x>.5))errors.push('footer dots did not reveal');
                }
                const target=page.locator('.centered-text,.large-statement,.section').nth(0);
                if(await target.count()){
                  await target.scrollIntoViewIfNeeded();await page.waitForTimeout(900);
                  const sample=await target.evaluate(el=>({top:el.getBoundingClientRect().top,text:(el.textContent||'').trim().slice(0,80)}));
                  console.log('SCROLL',path||'home',JSON.stringify(sample));
                }
              }
              await page.screenshot({path:'qa-screens/'+mode+'-'+(path.replaceAll('/','')||'home')+'.png',fullPage:false});
              console.log('STATE',mode,path||'home',JSON.stringify(state));
              const filtered=errors.filter(e=>!e.includes('favicon.ico'));
              if(!state.displayLoaded||!state.bodyLoaded){filtered.push('fonts not loaded')}
              if(filtered.length){failed=true;console.log('ERRORS',mode,path||'home',JSON.stringify(filtered))}
              await context.close();
            }
          }
          await browser.close();
          if(failed)process.exit(1);
          NODE
          node qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-motion-qa
          path: qa-screens
          retention-days: 3
