name: Robust aggregation evidence audit
on:
  pull_request:
    paths:
      - 'kernellum/discovery/**'
      - 'experiments/robust_revision/**'
      - 'results/robust_revision/**'
      - 'scripts/audit_robust_revision.py'
      - 'scripts/audit_representation_revision.py'
      - 'scripts/audit_support_revision.py'
      - 'tests/test_robust_revision.py'
      - '.github/workflows/robust-revision.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 uqtestfuns==0.6.0 pytest
      - run: python -m pytest -q
      - run: python scripts/audit_robust_revision.py
