name: SIMILARITY critical-path diagnostic

on:
  pull_request:
    paths:
      - 'docs/SIMILARITY_PATH_DIAGNOSTIC.md'
      - 'scripts/similarity_path_diagnostic.py'
      - 'scripts/similarity_path_analyze.py'
      - 'tests/test_similarity_path_diagnostic.py'
      - '.github/workflows/similarity-path-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        seed: [1,2,3,4,5]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install ECP5 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys nextpnr-ecp5 fpga-trellis
      - name: Route and decompose critical paths
        run: |
          PYTHONPATH=. python scripts/similarity_path_diagnostic.py --seed ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        with:
          name: pathdiag-s${{ matrix.seed }}
          path: results/similarity_path_diagnostic_s${{ matrix.seed }}.csv

  analyze:
    needs: route
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v5
        with:
          pattern: pathdiag-*
          path: results/similarity_path_diagnostic_download
          merge-multiple: true
      - name: Analyze path decomposition
        run: |
          python -m pip install numpy
          PYTHONPATH=. python scripts/similarity_path_analyze.py
      - uses: actions/upload-artifact@v4
        with:
          name: similarity-path-diagnostic-summary
          path: |
            results/similarity_path_diagnostic_summary.json
            results/similarity_path_diagnostic_combined.csv
