name: SIMILARITY fixed-PE diameter test

on:
  pull_request:
    paths:
      - 'rtl/similarity_diameter_broadcast.sv'
      - 'rtl/similarity_diameter_local.sv'
      - 'scripts/similarity_diameter_route.py'
      - 'scripts/similarity_diameter_validate.py'
      - 'tests/test_similarity_diameter.py'
      - '.github/workflows/similarity-diameter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        group: [64, 96]
        topology: [broadcast, local]
        seed: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install ECP5 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys nextpnr-ecp5 fpga-trellis
      - name: Route fixed-PE diameter points
        run: |
          PYTHONPATH=. python scripts/similarity_diameter_route.py \
            --group ${{ matrix.group }} \
            --topology ${{ matrix.topology }} \
            --seed ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        with:
          name: diameter-p${{ matrix.group }}-${{ matrix.topology }}-${{ matrix.seed }}
          path: results/similarity_diameter_p${{ matrix.group }}_${{ matrix.topology }}_s${{ matrix.seed }}.csv

  validate:
    needs: route
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v5
        with:
          pattern: diameter-*
          path: results/similarity_diameter_download
          merge-multiple: true
      - name: Analyze frozen diameter gate
        run: |
          python -m pip install numpy
          PYTHONPATH=. python scripts/similarity_diameter_validate.py
      - uses: actions/upload-artifact@v4
        with:
          name: similarity-diameter-validation
          path: |
            results/similarity_diameter_validation.json
            results/similarity_diameter_combined.csv
            results/similarity_diameter_points.csv
