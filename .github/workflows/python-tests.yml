name: Python regression tests

on:
  push:
    branches: [main]
    paths:
      - 'kernellum/**'
      - 'tests/**'
      - '.github/workflows/python-tests.yml'
  pull_request:
    paths:
      - 'kernellum/**'
      - 'tests/**'
      - 'bench/learn2design/**'
      - '.github/workflows/python-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install pytest numpy
      - run: PYTHONPATH=. python -m pytest -q

  learn2design-uifo-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install official Learn2Design environment
        run: |
          git clone --depth 1 https://github.com/artificial-scientist-lab/Learn2Design-2026.git /tmp/Learn2Design-2026
          python -m pip install -e /tmp/Learn2Design-2026
      - name: Residual-dimension search around best semantic transfer
        run: |
          python bench/learn2design/residual_refine.py \
            /tmp/Learn2Design-2026/dataset/dataset.h5 \
            --topology-seed 98591154
