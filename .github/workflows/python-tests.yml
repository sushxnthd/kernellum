name: Python regression tests

on:
  push:
    branches: [main]
    paths:
      - 'kernellum/**'
      - 'tests/**'
      - '.github/workflows/python-tests.yml'
  pull_request:
    paths:
      - 'kernellum/**'
      - 'tests/**'
      - 'bench/learn2design/**'
      - '.github/workflows/python-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install pytest numpy
      - run: PYTHONPATH=. python -m pytest -q

  learn2design-uifo-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install official Learn2Design environment
        run: |
          git clone --depth 1 https://github.com/artificial-scientist-lab/Learn2Design-2026.git /tmp/Learn2Design-2026
          python -m pip install -e /tmp/Learn2Design-2026
      - name: Package KERN-R3G-v0
        run: |
          cd bench/learn2design/KERN-R3G-v0
          zip -q -r /tmp/KERN-R3G-v0.zip submission.py requirements.txt
      - name: Official static validation
        run: |
          python /tmp/Learn2Design-2026/tools/validate_submission.py /tmp/KERN-R3G-v0.zip
      - name: Real UIFO retired-seed benchmark
        run: |
          python /tmp/Learn2Design-2026/tools/validate_submission.py \
            /tmp/KERN-R3G-v0.zip \
            --run-local \
            --topology-seed 98591154 \
            --optimizer-seed 1791403674 \
            --max-time-seconds 60
