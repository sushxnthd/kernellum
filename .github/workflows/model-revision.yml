name: Model revision evidence audit
on:
  pull_request:
    paths:
      - 'kernellum/discovery/**'
      - 'experiments/model_revision/**'
      - 'results/model_revision/**'
      - 'scripts/audit_model_revision.py'
      - 'tests/test_model_revision.py'
      - '.github/workflows/model-revision.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pytest
      - run: python -m pytest -q
      - run: mkdir -p build
      - run: python scripts/audit_model_revision.py --folder results/model_revision/frozen_run --out build/model-revision-audit.json
