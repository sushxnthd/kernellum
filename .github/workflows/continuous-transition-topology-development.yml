name: continuous-transition-topology-development

on:
  push:
    branches: [breakthrough-engine/continuous-transition-topology-20261019]
    paths:
      - docs/CONTINUOUS_TRANSITION_TOPOLOGY_*.md
      - scripts/evaluate_continuous_transition_topology_development.py
      - scripts/audit_continuous_transition_topology_development.py
      - .github/workflows/continuous-transition-topology-development.yml
  pull_request:
    paths:
      - docs/CONTINUOUS_TRANSITION_TOPOLOGY_*.md
      - scripts/evaluate_continuous_transition_topology_development.py
      - scripts/audit_continuous_transition_topology_development.py
      - .github/workflows/continuous-transition-topology-development.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  opened-development-falsification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[test]'
      - name: Execute exact LOFO audit twice
        run: |
          python scripts/evaluate_continuous_transition_topology_development.py --output /tmp/topology-1.json
          python scripts/evaluate_continuous_transition_topology_development.py --output /tmp/topology-2.json
          cmp /tmp/topology-1.json /tmp/topology-2.json
          cp /tmp/topology-1.json results/continuous_transition_topology_development.json
      - name: Independent audit
        run: python scripts/audit_continuous_transition_topology_development.py --result results/continuous_transition_topology_development.json --output results/continuous_transition_topology_development_audit.json
      - name: Preserve exact result
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/continuous_transition_topology_development.json results/continuous_transition_topology_development_audit.json
          if ! git diff --cached --quiet; then
            git commit -m "research: record continuous-topology development falsification"
            git push origin HEAD:$GITHUB_REF_NAME
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuous-transition-topology-development
          path: |
            results/continuous_transition_topology_development.json
            results/continuous_transition_topology_development_audit.json
