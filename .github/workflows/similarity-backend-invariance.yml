name: SIMILARITY compute-backend invariance

on:
  pull_request:
    paths:
      - 'docs/SIMILARITY_BACKEND_INVARIANCE_PLAN.md'
      - 'scripts/similarity_backend_invariance_route.py'
      - 'scripts/similarity_backend_invariance_validate.py'
      - 'tests/test_similarity_backend_invariance.py'
      - '.github/workflows/similarity-backend-invariance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        backend: [dsp,lut]
        topology: [broadcast,local]
        seed: [7,8,9]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install ECP5 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys nextpnr-ecp5 fpga-trellis
      - name: Route backend/topology matrix
        run: |
          PYTHONPATH=. python scripts/similarity_backend_invariance_route.py             --backend ${{ matrix.backend }}             --topology ${{ matrix.topology }}             --seed ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        with:
          name: backend-inv-${{ matrix.backend }}-${{ matrix.topology }}-s${{ matrix.seed }}
          path: results/similarity_backend_invariance_${{ matrix.backend }}_${{ matrix.topology }}_s${{ matrix.seed }}.csv

  validate:
    needs: route
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v5
        with:
          pattern: backend-inv-*
          path: results/similarity_backend_invariance_download
          merge-multiple: true
      - name: Evaluate frozen backend-invariance gate
        run: |
          python -m pip install numpy
          PYTHONPATH=. python scripts/similarity_backend_invariance_validate.py
      - uses: actions/upload-artifact@v4
        with:
          name: similarity-backend-invariance
          path: |
            results/similarity_backend_invariance_summary.json
            results/similarity_backend_invariance_combined.csv
