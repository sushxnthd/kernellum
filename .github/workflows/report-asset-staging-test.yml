name: Report asset staging test
on:
  push:
    branches: [research-publications]
    paths:
      - '.github/workflows/report-asset-staging-test.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify branch write
        run: |
          mkdir -p .report-stage
          printf 'ok\n' > .report-stage/write-test.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .report-stage/write-test.txt
          git commit -m "Verify report asset staging" || exit 0
          git push
