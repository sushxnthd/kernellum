name: NIST safety multistart

on:
  push:
    branches: [breakthrough-engine/nist-safety-constrained-multistart-20261019]
  pull_request:
    paths:
      - 'external/nist_strd/**'
      - 'scripts/*nist_safety_multistart.py'
      - 'results/nist_safety_multistart*'
      - 'docs/NIST_SAFETY_CONSTRAINED_MULTISTART_*'
      - '.github/workflows/nist-safety-multistart.yml'

jobs:
  external-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Record numerical environment
        run: python -c "import numpy, scipy; print(numpy.__version__, scipy.__version__)"
      - name: Verify frozen result and provenance
        run: python scripts/audit_nist_safety_multistart.py results/nist_safety_multistart.json
      - name: Reproduce exact benchmark
        run: |
          python scripts/evaluate_nist_safety_multistart.py > /tmp/reproduced.json
          cmp /tmp/reproduced.json results/nist_safety_multistart.json
