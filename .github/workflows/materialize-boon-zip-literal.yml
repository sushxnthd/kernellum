name: Materialize BOON ZIP literal test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/materialize-boon-zip-literal.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild the captured tree
        shell: bash
        run: |
          set -euo pipefail
          OUT="docs/boon-zip-literal"
          rm -rf "$OUT"
          mkdir -p "$OUT/css" "$OUT/js"

          # Use the production SSR document, then restrict its runtime to exactly
          # the CSS/JS filenames that existed in the user's saveweb2zip capture.
          curl -fL --retry 3 --retry-delay 2 https://www.boonglobal.io/ -o "$OUT/index.html"

          CSS_FILES=(
            'SanityImage.BjZBy7rz.css'
            'SanityVideo.DTJkAeiX.css'
            'ThreeView.EvK2eRF-.css'
            '_...DhQIo3bg.css'
            'default.qNKrSqlp.css'
            'entry.DcSZNwz6.css'
          )
          JS_FILES=(
            'BEW1fCGd.js' 'BEqJjq0f.js' 'BSgwrZLn.js' 'BWg2ILet.js'
            'BY7JGZ-d.js' 'BcInndtU.js' 'Beq67LXS.js' 'BftJo168.js'
            'Biot4gch.js' 'BkXUNdA6.js' 'Bne1fdj4.js' 'Bq-CSWMy.js'
            'By-qMKMM.js' 'C5519GSD.js' 'C9JD9LUG.js' 'CAcCrSPu.js'
            'CCxxUmVD.js' 'CJERePSo.js' 'CKK_ITnc.js' 'CMqDfFmB.js'
            'CV1CKauh.js' 'CcGBHYOs.js' 'Cecn1SPc.js' 'Cnn4cZyj.js'
            'CpJfINCX.js' 'Cs1zKDta.js' 'CwAE7HMs.js' 'CzsHsjRX.js'
            'D-KWWw4O.js' 'D2jCMkLa.js' 'DAaHEGkk.js' 'DHMWGXoR.js'
            'DMftEAj3.js' 'DMjiie3U.js' 'DRE_wQ1D.js' 'DTVziQxs.js'
            'DWPLS5pp.js' 'DXkU3Htz.js' 'DYLIcWIl.js' 'DipsUwhN.js'
            'DrZo1_5l.js' 'DyDaNXIu.js' 'QpDsFayR.js' 'XpXnEhtA.js'
            'Y-Lt9TyD.js' 'sb-_ndGO.js' 'v7rF5gio.js' 'wa5M3ceU.js'
          )

          for f in "${CSS_FILES[@]}"; do
            echo "fetch css/$f"
            curl -fL --retry 3 --retry-delay 2 "https://www.boonglobal.io/_nuxt/$f" -o "$OUT/css/$f"
          done
          for f in "${JS_FILES[@]}"; do
            echo "fetch js/$f"
            curl -fL --retry 3 --retry-delay 2 "https://www.boonglobal.io/_nuxt/$f" -o "$OUT/js/$f"
          done

          python - <<'PY'
          from pathlib import Path
          import re, urllib.request

          out = Path("docs/boon-zip-literal")
          css_files = {
            'SanityImage.BjZBy7rz.css','SanityVideo.DTJkAeiX.css',
            'ThreeView.EvK2eRF-.css','_...DhQIo3bg.css',
            'default.qNKrSqlp.css','entry.DcSZNwz6.css'
          }
          js_files = {
            'BEW1fCGd.js','BEqJjq0f.js','BSgwrZLn.js','BWg2ILet.js',
            'BY7JGZ-d.js','BcInndtU.js','Beq67LXS.js','BftJo168.js',
            'Biot4gch.js','BkXUNdA6.js','Bne1fdj4.js','Bq-CSWMy.js',
            'By-qMKMM.js','C5519GSD.js','C9JD9LUG.js','CAcCrSPu.js',
            'CCxxUmVD.js','CJERePSo.js','CKK_ITnc.js','CMqDfFmB.js',
            'CV1CKauh.js','CcGBHYOs.js','Cecn1SPc.js','Cnn4cZyj.js',
            'CpJfINCX.js','Cs1zKDta.js','CwAE7HMs.js','CzsHsjRX.js',
            'D-KWWw4O.js','D2jCMkLa.js','DAaHEGkk.js','DHMWGXoR.js',
            'DMftEAj3.js','DMjiie3U.js','DRE_wQ1D.js','DTVziQxs.js',
            'DWPLS5pp.js','DXkU3Htz.js','DYLIcWIl.js','DipsUwhN.js',
            'DrZo1_5l.js','DyDaNXIu.js','QpDsFayR.js','XpXnEhtA.js',
            'Y-Lt9TyD.js','sb-_ndGO.js','v7rF5gio.js','wa5M3ceU.js'
          }

          p = out / "index.html"
          s = p.read_text(encoding="utf-8")

          # Brand patch only. Keep BOON content/layout exactly as served.
          s = s.replace("<title>Boon", "<title>Kernellum")
          s = s.replace('aria-label="Boon"', 'aria-label="Kernellum"')
          s = s.replace('siteName:"Boon"', 'siteName:"Kernellum"')
          s = s.replace('"Boon",true,"https://www.boonglobal.io"', '"Kernellum",true,"https://www.boonglobal.io"')

          # Restrict initial assets to the files present in the ZIP.
          def localize(m):
              name = m.group(1)
              if name in css_files:
                  return "css/" + name
              if name in js_files:
                  return "js/" + name
              return "/__missing_from_zip__/" + name
          s = re.sub(r'/_nuxt/([^"\'?#]+)', localize, s)

          # Capture-equivalent payload.
          m = re.search(r'data-src="([^"]*_payload\.json[^"]*)"', s)
          payload_url = None
          if m:
              payload_url = m.group(1)
              if payload_url.startswith("/"):
                  payload_url = "https://www.boonglobal.io" + payload_url
              s = s[:m.start(1)] + "js/_payload.json" + s[m.end(1):]
          else:
              payload_url = "https://www.boonglobal.io/_payload.json"

          try:
              with urllib.request.urlopen(payload_url, timeout=30) as r:
                  (out/"js/_payload.json").write_bytes(r.read())
          except Exception as e:
              print("payload fetch failed:", e)
              (out/"js/_payload.json").write_text("[]", encoding="utf-8")

          # Do not redistribute font binaries. The test loads the exact named
          # fonts from BOON's origin while everything executable stays local.
          for css in out.joinpath("css").glob("*.css"):
              t = css.read_text(encoding="utf-8")
              t = t.replace("url(../fonts/mschn-medium.woff2)", 'url("https://www.boonglobal.io/fonts/mschn-medium.woff2")')
              t = t.replace("url(../fonts/mschn-semibold.woff2)", 'url("https://www.boonglobal.io/fonts/mschn-semibold.woff2")')
              t = t.replace("url(../fonts/suisse-book.woff2)", 'url("https://www.boonglobal.io/fonts/suisse-book.woff2")')
              t = t.replace("url(../fonts/suisse-medium.woff2)", 'url("https://www.boonglobal.io/fonts/suisse-medium.woff2")')
              css.write_text(t, encoding="utf-8")

          brand = """
          <style id="kernellum-name-only">
          a.logo>svg{opacity:0!important;width:0!important;overflow:hidden!important}
          a.logo:before{content:"KERNELLUM";font-family:MSCHN,sans-serif;font-weight:500;
            font-size:clamp(.95rem,.45vw + .8rem,1.25rem);letter-spacing:.02em;white-space:nowrap}
          </style>
          """
          s = s.replace("</head>", brand + "</head>", 1)
          p.write_text(s, encoding="utf-8")

          # Keep Pages from applying Jekyll transforms.
          (out/".nojekyll").write_text("", encoding="utf-8")
          (out/"CAPTURE_TEST.txt").write_text(
              "This path intentionally uses only the CSS/JS chunk filenames present in the user's saveweb2zip capture. "
              "Any requests to /__missing_from_zip__/ identify assets absent from the ZIP.\n",
              encoding="utf-8"
          )
          PY

      - name: Commit materialized capture test
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/boon-zip-literal
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Materialize literal BOON ZIP capture test"
          git push
