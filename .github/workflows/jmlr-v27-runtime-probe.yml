name: JMLR v27 runtime probes

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  nyuv2_one_epoch:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe NYUv2 source-faithful epoch
        env:
          GH_TOKEN: ${{ github.token }}
          WANDB_MODE: disabled
        run: |
          set +e
          python -m pip install --upgrade pip > /tmp/nyu_setup.log 2>&1
          pip install torch torchvision numpy scipy cvxpy wandb tqdm >> /tmp/nyu_setup.log 2>&1
          git clone https://github.com/OptMN-Lab/FairGrad.git fairgrad >> /tmp/nyu_setup.log 2>&1
          cd fairgrad && git checkout b58bce810e57288f7bf2c4c9effb7133b856739a >> /tmp/nyu_setup.log 2>&1 && cd ..
          curl -L --fail --retry 3 --retry-delay 5 -o nyuv2.zip "https://www.dropbox.com/scl/fo/p7n54hqfpfyc6fe6n62qk/AKVb28ZmgDiGdRMNkX5WJvo?rlkey=hcf31bdrezqjih36oi8usjait&dl=1" >> /tmp/nyu_setup.log 2>&1
          echo "ZIP_BYTES=$(wc -c < nyuv2.zip 2>/dev/null)" >> /tmp/nyu_setup.log
          unzip -q nyuv2.zip -d nyu_data >> /tmp/nyu_setup.log 2>&1
          ROOT=$(find "$PWD/nyu_data" -type d -name train -print | head -1 | xargs dirname)
          echo "ROOT=$ROOT" >> /tmp/nyu_setup.log
          if [ -z "$ROOT" ]; then
            STATUS=DATA_FAIL
            SEC=FAIL
          else
            cd fairgrad
            START=$(date +%s)
            PYTHONPATH="$PWD" python experiments/nyuv2/trainer.py --method=ls --seed=0 --n-epochs=1 --batch-size=2 --lr=1e-4 --data-path="$ROOT" --apply-augmentation=true > /tmp/nyu.log 2>&1
            RC=$?
            END=$(date +%s)
            SEC=$((END-START))
            if [ "$RC" -eq 0 ]; then STATUS=OK; else STATUS=TRAIN_FAIL_$RC; fi
          fi
          cd "$GITHUB_WORKSPACE"
          TAIL=$( (tail -15 /tmp/nyu_setup.log; tail -15 /tmp/nyu.log 2>/dev/null) | tr '\n' ' ' | cut -c1-5000)
          gh api repos/${{ github.repository }}/issues/120/comments -f body="NYUV2_RUNTIME_PROBE_V2 status=\`$STATUS\` seconds=\`$SEC\` log=\`$TAIL\`"
          exit 0

  qm9_one_epoch:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe QM9 source-faithful epoch
        env:
          GH_TOKEN: ${{ github.token }}
          WANDB_MODE: disabled
        run: |
          set +e
          python -m pip install --upgrade pip > /tmp/qm9_setup.log 2>&1
          pip install torch torchvision torch_geometric numpy scipy cvxpy wandb tqdm >> /tmp/qm9_setup.log 2>&1
          git clone https://github.com/OptMN-Lab/FairGrad.git fairgrad >> /tmp/qm9_setup.log 2>&1
          cd fairgrad && git checkout b58bce810e57288f7bf2c4c9effb7133b856739a >> /tmp/qm9_setup.log 2>&1
          START=$(date +%s)
          PYTHONPATH="$PWD" python experiments/quantum_chemistry/trainer.py --method=ls --seed=0 --n-epochs=1 --batch-size=120 --lr=1e-3 --data-path="$PWD/qm9_data" --scale-y=true > /tmp/qm9.log 2>&1
          RC=$?
          END=$(date +%s)
          SEC=$((END-START))
          if [ "$RC" -eq 0 ]; then STATUS=OK; else STATUS=TRAIN_FAIL_$RC; fi
          cd "$GITHUB_WORKSPACE"
          TAIL=$( (tail -15 /tmp/qm9_setup.log; tail -15 /tmp/qm9.log 2>/dev/null) | tr '\n' ' ' | cut -c1-5000)
          gh api repos/${{ github.repository }}/issues/120/comments -f body="QM9_RUNTIME_PROBE_V2 status=\`$STATUS\` seconds=\`$SEC\` log=\`$TAIL\`"
          exit 0
