name: Cleanup old website branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-old-web-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Delete obsolete website branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "codex/fix-live-instrument-init"
            "codex/immersive-research-environment"
            "codex/kernel-matrix-redesign"
            "codex/research-presentation-redesign"
            "codex/website-asset-versioning"
            "codex/website-overflow-fix"
            "codex/website-visual-refresh"
            "review/kernellum-art-motion"
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done

      - name: Remove this one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-old-web-branches.yml
          git commit -m "Remove old website branch cleanup workflow"
          git push origin HEAD:main
