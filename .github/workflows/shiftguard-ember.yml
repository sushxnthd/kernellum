name: ShiftGuard EMBER2024 temporal

on:
  push:
    branches:
      - research/shiftguard-ember
    paths:
      - "research/shiftguard/**"
      - ".github/workflows/shiftguard-ember.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  temporal-ember:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      PYTHONUNBUFFERED: "1"
      SHIFTGUARD_WORK: ${{ runner.temp }}/shiftguard
      HF_HUB_DISABLE_XET: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/shiftguard-ember

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install             "git+https://github.com/FutureComputing4AI/EMBER2024.git"             "bloom-filter==1.3.3"             numpy scipy scikit-learn joblib lightgbm pandas

      - name: Environment
        run: |
          python --version
          df -h
          free -h

      - name: Run temporal EMBER experiment
        run: |
          mkdir -p research/shiftguard/results
          python research/shiftguard/ember2024_temporal.py 2>&1 | tee research/shiftguard/results/run.log

      - name: Upload ShiftGuard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shiftguard-ember2024-temporal
          path: |
            research/shiftguard/results/**
          if-no-files-found: warn
          retention-days: 30
