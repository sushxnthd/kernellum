name: SIMILARITY ASIC electrical repair canary

env:
  ORFS_IMAGE: openroad/orfs@sha256:573c1716efa0e286c4f641c26d343e20929d58d27fffbb22be2d0b93f09764f6

on:
  pull_request:
    paths:
      - 'asic/repair_canary/**'
      - 'scripts/similarity_asic_transfer_route.py'
      - 'scripts/similarity_asic_repair_canary.py'
      - 'tests/test_similarity_asic_repair_canary.py'
      - '.github/workflows/similarity-asic-repair-canary.yml'
  push:
    branches: [main]
    paths:
      - 'asic/repair_canary/**'
      - 'scripts/similarity_asic_repair_canary.py'
      - '.github/workflows/similarity-asic-repair-canary.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: python -m pip install pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_similarity_asic_repair_canary.py tests/test_similarity_asic_transfer.py
      - name: Verify pinned config and exclusion
        run: |
          for platform in nangate45 sky130hd; do
            grep -qx 'export CAP_MARGIN = 20' "asic/repair_canary/config_${platform}.mk"
            grep -qx 'export SLEW_MARGIN = 20' "asic/repair_canary/config_${platform}.mk"
          done
          test -f docs/SIMILARITY_NEXT_BREAKTHROUGH.md

  route:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        platform: [nangate45, sky130hd]
        topology: [broadcast, local]
        seed: [11, 29, 47]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Prepare pinned OpenROAD flow
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static
          docker pull "$ORFS_IMAGE"
          mkdir -p "$RUNNER_TEMP/orfs"
          cid="$(docker create "$ORFS_IMAGE")"
          docker cp "$cid:/OpenROAD-flow-scripts/flow" "$RUNNER_TEMP/orfs/"
          docker rm "$cid"
          test -f "$RUNNER_TEMP/orfs/flow/Makefile"
      - name: Route excluded 7x7 canary
        run: |
          PYTHONPATH=. python scripts/similarity_asic_repair_canary.py \
            --platform ${{ matrix.platform }} \
            --topology ${{ matrix.topology }} \
            --seed ${{ matrix.seed }} \
            --flow-root "$RUNNER_TEMP/orfs/flow"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: similarity-asic-repair-route-${{ matrix.platform }}-${{ matrix.topology }}-s${{ matrix.seed }}
          path: |
            results/similarity_asic_repair_${{ matrix.platform }}_${{ matrix.topology }}_s${{ matrix.seed }}.csv
            build/similarity_asic_repair_canary/${{ matrix.platform }}/${{ matrix.topology }}/s${{ matrix.seed }}
          retention-days: 30

  validate:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [preflight, route]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v5
        with:
          pattern: similarity-asic-repair-route-*
          path: results/similarity_asic_repair_download
      - name: Apply complete electrical gate
        run: |
          PYTHONPATH=. python scripts/similarity_asic_repair_canary.py \
            --evaluate results/similarity_asic_repair_download
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: similarity-asic-repair-canary-summary
          path: results/similarity_asic_repair_canary.json
          retention-days: 30
