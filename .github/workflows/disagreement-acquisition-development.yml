name: disagreement-acquisition-development

on:
  push:
    branches: [breakthrough-engine/support-aware-abstention-20261016]
    paths:
      - docs/DISAGREEMENT_ACQUISITION_*.md
      - scripts/evaluate_disagreement_acquisition.py
      - scripts/audit_disagreement_acquisition.py
      - results/disagreement_acquisition_*.json
      - .github/workflows/disagreement-acquisition-development.yml
  workflow_dispatch:

jobs:
  opened-development:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[test]'
      - name: Execute frozen acquisition screen
        run: |
          python scripts/evaluate_disagreement_acquisition.py \
            --decisions disagreement-decisions.json \
            --output disagreement-result.json
      - name: Independent refit audit
        run: |
          python scripts/audit_disagreement_acquisition.py \
            --decisions disagreement-decisions.json \
            --result disagreement-result.json \
            --output disagreement-audit.json
      - name: Require terminal classification and exact audit
        run: |
          python - <<'PY'
          import json
          result=json.load(open('disagreement-result.json'))
          audit=json.load(open('disagreement-audit.json'))
          assert result['status'] in {'ADVANCE_TO_PROSPECTIVE','KILL_ONE_POINT_DISAGREEMENT'}
          assert audit['status']=='PASS' and audit['passed']==audit['checks']==319
          PY
      - name: Deterministic primary rerun
        run: |
          cp disagreement-decisions.json /tmp/disagreement-decisions.json
          cp disagreement-result.json /tmp/disagreement-result.json
          python scripts/evaluate_disagreement_acquisition.py \
            --decisions disagreement-decisions.json \
            --output disagreement-result.json >/dev/null
          cmp /tmp/disagreement-decisions.json disagreement-decisions.json
          cmp /tmp/disagreement-result.json disagreement-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: disagreement-acquisition-development
          path: |
            disagreement-decisions.json
            disagreement-result.json
            disagreement-audit.json
