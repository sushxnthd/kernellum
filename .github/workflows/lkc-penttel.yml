name: LKC pentagonal telescoping probe
on:
  push:
    branches: [lkc-stage1-superopt]
    paths:
      - 'lkc_stage1/pent_tel_probe.lean'
      - '.github/workflows/lkc-penttel.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.1
          source "$HOME/.elan/env"
          git clone -q https://github.com/SAIRcompetition/lean-kernel-challenge.git upstream
          cd upstream && git checkout -q 940f0a2ead23ef70ab1387edabb347e629111edd
          cd problems/partition && lake build Spec
      - name: Build values repeat
        shell: bash
        run: |
          source "$HOME/.elan/env"
          cp lkc_stage1/pent_tel_probe.lean upstream/problems/partition/PentTelProbe.lean
          cd upstream/problems/partition
          lake env lean PentTelProbe.lean -o .lake/build/lib/lean/PentTelProbe.olean
          for pair in "0 1" "1 1" "2 2" "3 3" "5 7" "10 42" "14 135" "18 385" "22 1002" "26 2436" "32 8349" "36 17977" "40 37338" "50 204226" "60 966467" "63 1505499"; do
            set -- $pair; n=$1; v=$2
            printf 'import PentTelProbe\nset_option maxRecDepth 8000000\nset_option maxHeartbeats 0\nexample : PentTelProbe.impl %s = %s := by rfl\n' "$n" "$v" > P.lean
            lake env lean P.lean
          done
          {
            echo 'import PentTelProbe'
            echo 'set_option maxRecDepth 8000000'
            echo 'set_option maxHeartbeats 0'
            for i in $(seq 1 1000); do echo "theorem q$i : PentTelProbe.impl 36 = 17977 := by rfl"; done
          } > R.lean
          echo 'PENTTEL x1000 n36'
          /usr/bin/time -f 'elapsed=%e user=%U maxrss=%M' lake env lean R.lean
