name: basin-transition-continuation

on:
  push:
    branches:
      - breakthrough-engine/basin-transition-continuation-20261018
    paths:
      - docs/BASIN_TRANSITION_CONTINUATION_*.md
      - scripts/evaluate_basin_transition_continuation.py
      - scripts/audit_basin_transition_continuation.py
      - .github/workflows/basin-transition-continuation.yml
  pull_request:
    paths:
      - docs/BASIN_TRANSITION_CONTINUATION_*.md
      - scripts/evaluate_basin_transition_continuation.py
      - scripts/audit_basin_transition_continuation.py
      - .github/workflows/basin-transition-continuation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prospective:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[test]'
      - name: Execute frozen continuation selector twice
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          python scripts/evaluate_basin_transition_continuation.py --decisions results/basin_transition_continuation_decisions.json --output results/basin_transition_continuation_result.json
          cp results/basin_transition_continuation_decisions.json /tmp/decisions-first.json
          cp results/basin_transition_continuation_result.json /tmp/result-first.json
          python scripts/evaluate_basin_transition_continuation.py --decisions results/basin_transition_continuation_decisions.json --output results/basin_transition_continuation_result.json
          cmp /tmp/decisions-first.json results/basin_transition_continuation_decisions.json
          cmp /tmp/result-first.json results/basin_transition_continuation_result.json
      - name: Independent audit
        run: python scripts/audit_basin_transition_continuation.py --decisions results/basin_transition_continuation_decisions.json --result results/basin_transition_continuation_result.json --output results/basin_transition_continuation_audit.json
      - name: Preserve raw results
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/basin_transition_continuation_decisions.json results/basin_transition_continuation_result.json results/basin_transition_continuation_audit.json
          git commit -m "research: record basin-transition prospective result"
          git push origin HEAD:$GITHUB_REF_NAME
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: basin-transition-continuation
          path: |
            results/basin_transition_continuation_decisions.json
            results/basin_transition_continuation_result.json
            results/basin_transition_continuation_audit.json
