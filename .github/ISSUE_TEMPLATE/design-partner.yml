name: Design partner interest
description: Propose a non-confidential workload for a Kernellum evaluation.
title: "[design-partner] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for considering a Kernellum evaluation.

        **Do not post confidential models, datasets, customer information, API keys, proprietary implementation details, or secrets in this public issue.**

        Kernellum's current validated path is deliberately narrow: compact inference workloads dominated by dense / matrix operations, with the cleanest path today being sequential ONNX Gemm/ReLU graphs. Unsupported operators will be reported explicitly rather than silently approximated.
  - type: input
    id: team
    attributes:
      label: Team / organization
      description: Public name, or a generic description if you prefer.
      placeholder: "e.g. university robotics team / edge-AI startup"
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: Public contact route
      description: Optional public GitHub handle or project link. Do not post a private email if you do not want it public.
      placeholder: "e.g. @github-handle or project URL"
    validations:
      required: false
  - type: input
    id: workload
    attributes:
      label: Workload
      description: Non-confidential model or inference category.
      placeholder: "e.g. compact classifier, anomaly detector, sensor-fusion MLP"
    validations:
      required: true
  - type: input
    id: model_source
    attributes:
      label: Public model / surrogate
      description: Link to a public ONNX model or repository if one can be shared. A representative public surrogate is also acceptable.
      placeholder: "https://github.com/... or https://..."
    validations:
      required: false
  - type: textarea
    id: shape_ops
    attributes:
      label: Model shape and operators
      description: If known, list tensor dimensions/layers and major operators.
      placeholder: |
        Input: 64
        Layers: Gemm 64→32, ReLU, Gemm 32→16, ReLU, Gemm 16→8
        Precision today: FP32
    validations:
      required: false
  - type: dropdown
    id: data
    attributes:
      label: Calibration / representative data availability
      options:
        - Public data available
        - Can provide non-confidential representative data privately
        - Synthetic representative inputs are acceptable
        - Unknown
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Target platform
      description: FPGA / edge device / ASIC exploration / unknown.
      placeholder: "e.g. ECP5 FPGA, resource-constrained edge device, unknown"
    validations:
      required: true
  - type: dropdown
    id: constraint
    attributes:
      label: Primary constraint
      options:
        - Latency
        - Throughput
        - Area / FPGA resources
        - Power / energy
        - Memory
        - Cost
        - Other
    validations:
      required: true
  - type: input
    id: quantitative_target
    attributes:
      label: Quantitative target
      description: Optional. Give a concrete target if one exists.
      placeholder: "e.g. ≤2 ms, ≤20k LUTs, ≤500 mW, 25 MHz board clock"
    validations:
      required: false
  - type: textarea
    id: objective
    attributes:
      label: What should Kernellum evaluate?
      description: Keep this public and non-confidential.
      placeholder: "Describe the deployment objective, baseline if any, and what a useful result would look like."
    validations:
      required: true
  - type: checkboxes
    id: permissions
    attributes:
      label: Publication boundary
      options:
        - label: I understand this issue is public and I have not posted confidential/proprietary material.
          required: true
        - label: Kernellum may publish results derived from the public/non-confidential workload described here.
          required: false
