<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Kernellum Kernel Matrix mark</title>
  <desc id="desc">A central hardware kernel routes model inputs through a modular computation matrix.</desc>
  <defs>
    <pattern id="matrix" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect x="1" y="1" width="18" height="18" fill="#0b0f0c" stroke="#202821" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" fill="#070907"/>
  <rect x="4" y="4" width="120" height="120" fill="url(#matrix)" stroke="#313a32" stroke-width="2"/>
  <g fill="none" stroke="#b9f35d" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M22 34h17l18 20M22 64h30M22 94h17l18-20"/>
    <path d="M71 54l18-20h17M76 64h30M71 74l18 20h17"/>
  </g>
  <g fill="#79d8c1">
    <rect x="18" y="30" width="8" height="8"/><rect x="18" y="60" width="8" height="8"/><rect x="18" y="90" width="8" height="8"/>
    <rect x="102" y="30" width="8" height="8"/><rect x="102" y="60" width="8" height="8"/><rect x="102" y="90" width="8" height="8"/>
  </g>
  <path d="M64 45l19 19-19 19-19-19z" fill="#b9f35d" filter="url(#glow)"/>
  <path d="M64 55l9 9-9 9-9-9z" fill="#070907"/>
  <g fill="#4e5b50">
    <rect x="31" y="19" width="5" height="5"/><rect x="92" y="48" width="5" height="5"/><rect x="31" y="104" width="5" height="5"/>
  </g>
</svg>
